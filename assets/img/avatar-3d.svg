<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <radialGradient id="bg" cx="35%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#E9D5FF"/>
      <stop offset="45%" stop-color="#A855F7"/>
      <stop offset="100%" stop-color="#6D28D9"/>
    </radialGradient>
    <linearGradient id="suit" x1="20%" y1="0%" x2="85%" y2="100%">
      <stop offset="0%" stop-color="#38466e"/>
      <stop offset="55%" stop-color="#1c2740"/>
      <stop offset="100%" stop-color="#0f1526"/>
    </linearGradient>
    <linearGradient id="skin" x1="15%" y1="0%" x2="90%" y2="100%">
      <stop offset="0%" stop-color="#f0c39b"/>
      <stop offset="55%" stop-color="#d9a878"/>
      <stop offset="100%" stop-color="#b98457"/>
    </linearGradient>
    <linearGradient id="hair" x1="10%" y1="0%" x2="90%" y2="100%">
      <stop offset="0%" stop-color="#3a2c22"/>
      <stop offset="100%" stop-color="#150f0b"/>
    </linearGradient>
    <linearGradient id="tie" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3a3a3a"/>
      <stop offset="100%" stop-color="#141414"/>
    </linearGradient>
    <radialGradient id="gloss" cx="32%" cy="24%" r="55%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="ao" cx="50%" cy="100%" r="60%">
      <stop offset="0%" stop-color="#000000" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="circleClip">
      <circle cx="100" cy="100" r="100"/>
    </clipPath>
  </defs>

  <g clip-path="url(#circleClip)">
    <circle cx="100" cy="100" r="100" fill="url(#bg)"/>

    <!-- shoulders / suit -->
    <path d="M28 200 C28 150 56 122 100 122 C144 122 172 150 172 200 Z" fill="url(#suit)"/>
    <!-- suit shoulder highlight -->
    <path d="M40 196 C42 156 64 132 92 126 C70 136 54 160 50 196 Z" fill="#ffffff" opacity="0.08"/>

    <!-- shirt collar -->
    <path d="M86 128 L100 150 L92 132 Z" fill="#f3f1ee"/>
    <path d="M114 128 L100 150 L108 132 Z" fill="#e7e4df"/>
    <!-- tie -->
    <path d="M96 134 L104 134 L107 148 L100 158 L93 148 Z" fill="url(#tie)"/>

    <!-- neck -->
    <rect x="86" y="100" width="28" height="34" rx="10" fill="url(#skin)"/>

    <!-- ears -->
    <ellipse cx="62" cy="88" rx="7" ry="10" fill="url(#skin)"/>
    <ellipse cx="138" cy="88" rx="7" ry="10" fill="url(#skin)"/>

    <!-- head -->
    <ellipse cx="100" cy="82" rx="38" ry="42" fill="url(#skin)"/>

    <!-- jaw stubble shade -->
    <path d="M66 92 C72 112 86 122 100 122 C114 122 128 112 134 92 C128 108 114 116 100 116 C86 116 72 108 66 92 Z" fill="#2a1c12" opacity="0.16"/>

    <!-- hair -->
    <path d="M58 78 C54 46 76 26 100 26 C124 26 146 46 142 78 C140 62 130 66 126 56 C118 66 92 66 78 54 C72 64 60 62 58 78 Z" fill="url(#hair)"/>
    <!-- sideburns -->
    <path d="M60 70 C58 82 60 92 65 100 C61 90 60 80 62 70 Z" fill="url(#hair)"/>
    <path d="M140 70 C142 82 140 92 135 100 C139 90 140 80 138 70 Z" fill="url(#hair)"/>

    <!-- mustache -->
    <path d="M85 94 C90 90 96 93 100 93 C104 93 110 90 115 94 C111 91 106 96 100 96 C94 96 89 91 85 94 Z" fill="#1c120b"/>
    <!-- mouth -->
    <path d="M89 102 C94 106 106 106 111 102 C107 106 102 108 100 108 C98 108 93 106 89 102 Z" fill="#3a2216" opacity="0.75"/>

    <!-- eyes -->
    <ellipse cx="86" cy="80" rx="3.2" ry="3.6" fill="#241a12"/>
    <ellipse cx="114" cy="80" rx="3.2" ry="3.6" fill="#241a12"/>

    <!-- gloss + ambient occlusion overlays -->
    <circle cx="100" cy="100" r="100" fill="url(#gloss)"/>
    <circle cx="100" cy="100" r="100" fill="url(#ao)"/>
  </g>
</svg>

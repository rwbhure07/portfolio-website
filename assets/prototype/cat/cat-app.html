      '<div class="kpi-tile-top"><div class="kpi-icon" style="--kpi-icon-bg:var(--viz-critical-bg);--kpi-icon-fg:var(--viz-critical-text)"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0Z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg></div></div>' +
      '<span class="kpi-label" title="Assessees scoring below 70% of benchmark">At Risk</span>' +
      '<span class="kpi-value">' + userBandCounts.critical + ' <span class="sub">of ' + totalUsers + '</span></span>' +
      '<div class="kpi-foot"><div class="kpi-mini-bar-track">' +
      ['good', 'warning', 'critical'].map(function (b) {
        var pct = totalUsers ? (userBandCounts[b] / totalUsers) * 100 : 0;
        return pct > 0 ? '<span class="kpi-mini-bar-seg" style="width:' + pct + '%;background:' + BAND_COLOR[b] + '"></span>' : '';
      }).join('') + '</div>' +
      '<div class="kpi-mini-legend"><span>' + userBandCounts.good + ' ok</span><span>' + userBandCounts.warning + ' watch</span><span>' + userBandCounts.critical + ' risk</span></div></div></div>';

    /* 4 — biggest skill gap */
    html += '<div class="kpi-tile" style="--kpi-accent:var(--viz-warning)">' +
      '<div class="kpi-tile-top"><div class="kpi-icon" style="--kpi-icon-bg:var(--viz-warning-bg);--kpi-icon-fg:var(--viz-warning-text)"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3Z"/><line x1="12" y1="9" x2="12" y2="13"/></svg></div></div>' +
      '<span class="kpi-label">Biggest Skill Gap</span>' +
      (worst
        ? '<span class="kpi-value">' + (worst.score - worst.benchmark).toFixed(1) + '</span>' +
          '<div class="kpi-foot"><div class="kpi-gap-name" title="' + worst.label + '">' + worst.label + '</div>' +
          '<div class="kpi-note">' + worst.score.toFixed(1) + ' vs target ' + worst.benchmark.toFixed(1) + '</div></div>'
        : '<span class="kpi-value">—</span>') +
      '</div>';

    /* 5 — total assessments + role mix */
    html += '<div class="kpi-tile" style="--kpi-accent:var(--color-border)">' +
      '<div class="kpi-tile-top"><div class="kpi-icon"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="m9 12 2 2 4-4"/></svg></div></div>' +
      '<span class="kpi-label" title="Total assessment records in scope">Assessments</span>' +
      '<span class="kpi-value">' + filtered.length + '</span>' +
      '<div class="kpi-foot"><div class="kpi-mini-bar-track">' +
      ROLES.map(function (r, i) {
        var count = filtered.filter(function (f) { return f.role === r; }).length;
        var pct = filtered.length ? (count / filtered.length) * 100 : 0;
        var shades = ['var(--viz-blue-700)', 'var(--viz-blue-500)', 'var(--viz-blue-300)', 'var(--viz-blue-100)'];
        return pct > 0 ? '<span class="kpi-mini-bar-seg" style="width:' + pct + '%;background:' + shades[i % shades.length] + '"></span>' : '';
      }).join('') + '</div>' +
      '<div class="kpi-mini-legend"><span>' + totalUsers + ' assessees</span><span>' + uniqueVals(filtered, 'surveyId').length + ' surveys</span></div></div></div>';

    document.getElementById('kpi-grid').innerHTML = html;
  }

  /* ============================================================
     Tabs
  ============================================================ */
  var TABS = [
    { key: 'overview', label: 'Overview' },
    { key: 'competency', label: 'Competency Analysis' },
    { key: 'role', label: 'Role Analysis' },
    { key: 'assessee', label: 'Assessee Report' }
  ];
  var activeTab = 'overview';

  function renderTabsUI() {
    document.getElementById('report-tabs').innerHTML = TABS.map(function (t) {
      return '<button type="button" class="report-tab' + (t.key === activeTab ? ' is-active' : '') + '" data-tab="' + t.key + '">' + t.label + '</button>';
    }).join('');
  }
  document.getElementById('report-tabs').addEventListener('click', function (e) {
    var btn = e.target.closest('[data-tab]');
    if (!btn) return;
    var key = btn.getAttribute('data-tab');
    if (key !== 'overview' && key !== 'competency') return; /* Role Analysis and Assessee Report have no screen built — visible but inert */
    activeTab = key;
    renderTabsUI();
    renderAll();
  });

  /* ---- tab: overview ---- */
  function tabOverview(filtered) {
    var userBandCounts = { good: 0, warning: 0, critical: 0 };
    var uids = uniqueVals(filtered, 'assesseeUid');
    uids.forEach(function (uid) {
      var rows = filtered.filter(function (f) { return f.assesseeUid === uid; });
      userBandCounts[bandOf(avg(rows.map(function (r) { return r.weight; })), avg(rows.map(function (r) { return r.benchmark; })))]++;
    });

    return '<div class="row-2col is-swapped">' +
      '<div class="chart-card"><div class="chart-header"><div><span class="chart-title">Overall User Performance</span>' +
      '<div class="chart-subtitle">' + uids.length + ' assessees, by benchmark band</div></div></div>' +
      '<div class="chart-body">' + renderDonut([
        { value: userBandCounts.good, color: 'var(--viz-good)' },
        { value: userBandCounts.warning, color: 'var(--viz-warning)' },
        { value: userBandCounts.critical, color: 'var(--viz-critical)' }
      ], uids.length, 'Assessees') + '</div>' +
      '<div class="chart-legend">' + ['good', 'warning', 'critical'].map(function (b) {
        return '<span class="chart-legend-item"><span class="chart-legend-swatch" style="background:' + BAND_COLOR[b] + '"></span>' + userBandCounts[b] + ' ' + b + '</span>';
      }).join('') + '</div></div>' +
      '<div class="chart-card"><div class="chart-header"><div><span class="chart-title">Assessee Distribution by Competency</span>' +
      '<div class="chart-subtitle">How many assessees are green, amber or red on each competency</div></div>' +
      '</div>' +
      '<div class="chart-body band-dist-scroll">' + renderBandDistribution(assesseeBandDistributionByCompetency(filtered), 'people') + '</div></div>' +
      '</div>' +

      '<div class="chart-card">' +
      '<div class="chart-header"><div><span class="chart-title">Competency × Role Performance</span>' +
      '<div class="chart-subtitle">Average weighted score for every competency, broken down by role</div></div>' +
      '</div>' +
      '<div class="heatmap-scroll">' + heatmapHtml(filtered) + '</div></div>';
  }

  /* ---- tab: competency analysis ---- */
  function tabCompetency(filtered) {
    var byCompetency = uniqueVals(filtered, 'competency').map(function (c) {
      var rows = filtered.filter(function (f) { return f.competency === c; });
      return { label: c, score: avg(rows.map(function (r) { return r.weight; })), benchmark: BENCHMARK[c] };
    });
    var levelRows = uniqueVals(filtered, 'competency').map(function (c) {
      var rows = filtered.filter(function (f) { return f.competency === c; });
      var counts = { Foundation: 0, Proficient: 0, Advance: 0 };
      rows.forEach(function (r) { counts[r.level]++; });
      return { label: c, counts: counts };
    });

    return '<div class="chart-card">' +
      '<div class="chart-header"><div><span class="chart-title">Score vs Benchmark by Competency</span>' +
      '<div class="chart-subtitle">Weighted average (0–3) · gap pill shows distance from target</div></div>' +
      '<div class="chart-legend">' +
      '<span class="chart-legend-item"><span class="chart-legend-swatch" style="background:var(--viz-blue-500)"></span>Score</span>' +
      '<span class="chart-legend-item"><span class="chart-legend-swatch" style="background:var(--viz-benchmark)"></span>Benchmark</span></div></div>' +
      '<div class="chart-body chart-body-scroll">' + renderPairBars(byCompetency) + '</div></div>' +

      '<div class="row-2col">' +
      '<div class="chart-card">' +
      '<div class="chart-header"><div><span class="chart-title">Competency Group Analysis</span>' +
      '<div class="chart-subtitle">How many competencies sit in each band, per group</div></div>' +
      '</div>' +
      '<div class="chart-body band-dist-scroll">' + renderBandDistribution(groupBandDistribution(filtered), 'comp.') + '</div></div>' +

      '<div class="chart-card">' +
      '<div class="chart-header"><div><span class="chart-title">Score Trend</span>' +
      '<div class="chart-subtitle">Average weighted score by month, vs benchmark reference</div></div></div>' +
      '<div class="chart-body">' + renderAreaTrend(
        MONTH_LABELS.map(function (label, idx) { return { label: label, value: avg(filtered.filter(function (f) { return f.month === idx; }).map(function (f) { return f.weight; })) }; }),
        avg(filtered.map(function (f) { return f.benchmark; })) || 2
      ) + '</div></div>' +
      '</div>' +

      '<div class="chart-card">' +
      '<div class="chart-header"><div><span class="chart-title">Proficiency Level Mix</span>' +
      '<div class="chart-subtitle">How many assessees landed at each level, per competency</div></div>' +
      '<div class="chart-legend">' +
      '<span class="chart-legend-item"><span class="chart-legend-swatch" style="background:var(--viz-blue-100)"></span>Foundation (1)</span>' +
      '<span class="chart-legend-item"><span class="chart-legend-swatch" style="background:var(--viz-blue-300)"></span>Proficient (2)</span>' +
      '<span class="chart-legend-item"><span class="chart-legend-swatch" style="background:var(--viz-blue-700)"></span>Advance (3)</span></div></div>' +
      '<div class="chart-body stacked-levels-scroll">' + renderStackedLevels(levelRows) + '</div></div>';
  }

  /* ---- tab: role analysis ---- */
  function tabRole(filtered) {
    var roleRows = uniqueVals(filtered, 'role').map(function (r) {
      var rows = filtered.filter(function (f) { return f.role === r; });
      var score = avg(rows.map(function (x) { return x.weight; }));
      var benchmark = avg(rows.map(function (x) { return x.benchmark; }));
      return { label: r, score: score, band: bandOf(score, benchmark) };
    });
    var groupRows = uniqueVals(filtered, 'group').map(function (g) {
      var rows = filtered.filter(function (f) { return f.group === g; });
      return { label: g, score: avg(rows.map(function (r) { return r.weight; })), benchmark: avg(rows.map(function (r) { return r.benchmark; })) };
    });
    var roleLevelRows = uniqueVals(filtered, 'role').map(function (r) {
      var rows = filtered.filter(function (f) { return f.role === r; });
      var counts = { Foundation: 0, Proficient: 0, Advance: 0 };
      rows.forEach(function (x) { counts[x.level]++; });
      return { label: r, counts: counts };
    });

    return '<div class="chart-card">' +
      '<div class="chart-header"><div><span class="chart-title">Role-wise Average Score</span>' +
      '<div class="chart-subtitle">Colored by benchmark band</div></div>' +
      '</div>' +
      '<div class="chart-body">' + renderBandBars(roleRows) + '</div></div>' +

      '<div class="chart-card">' +
      '<div class="chart-header"><div><span class="chart-title">Score vs Benchmark by Competency Group</span>' +
      '<div class="chart-subtitle">Which capability areas are ahead of or behind target</div></div>' +
      '<div class="chart-legend">' +
      '<span class="chart-legend-item"><span class="chart-legend-swatch" style="background:var(--viz-blue-500)"></span>Score</span>' +
      '<span class="chart-legend-item"><span class="chart-legend-swatch" style="background:var(--viz-benchmark)"></span>Benchmark</span></div></div>' +
      '<div class="chart-body">' + renderPairBars(groupRows) + '</div></div>' +

      '<div class="chart-card">' +
      '<div class="chart-header"><div><span class="chart-title">Proficiency Level Mix by Role</span>' +
      '<div class="chart-subtitle">Distribution of awarded levels within each role</div></div>' +
      '<div class="chart-legend">' +
      '<span class="chart-legend-item"><span class="chart-legend-swatch" style="background:var(--viz-blue-100)"></span>Foundation</span>' +
      '<span class="chart-legend-item"><span class="chart-legend-swatch" style="background:var(--viz-blue-300)"></span>Proficient</span>' +
      '<span class="chart-legend-item"><span class="chart-legend-swatch" style="background:var(--viz-blue-700)"></span>Advance</span></div></div>' +
      '<div class="chart-body">' + renderStackedLevels(roleLevelRows) + '</div></div>';
  }

  /* ---- tab: assessee report ---- */
  function tabAssessee(filtered) {
    var rows = uniqueVals(filtered, 'assesseeUid').map(function (uid) {
      var recs = filtered.filter(function (f) { return f.assesseeUid === uid; });
      var score = avg(recs.map(function (r) { return r.weight; }));
      var benchmark = avg(recs.map(function (r) { return r.benchmark; }));
      return { uid: uid, name: recs[0].assesseeName, role: recs[0].role, score: score, benchmark: benchmark, band: bandOf(score, benchmark), count: recs.length };
    }).sort(function (a, b) { return b.score - a.score; });

    var body = rows.map(function (r) {
      var pct = Math.round((r.score / 3) * 100);
      var statusText = r.band === 'good' ? 'On track' : r.band === 'warning' ? 'Watch' : 'At risk';
      return '<tr><td>' + r.uid + '</td><td>' + r.name + '</td><td>' + r.role + '</td>' +
        '<td><span class="mini-bar-track"><span class="mini-bar-fill" style="width:' + pct + '%;background:' + BAND_COLOR[r.band] + '"></span></span>' + r.score.toFixed(1) + ' / 3.0</td>' +
        '<td>' + r.benchmark.toFixed(1) + '</td>' +
        '<td><span class="band-pill" style="color:' + BAND_TEXT[r.band] + '"><span class="status-dot" style="background:' + BAND_COLOR[r.band] + '"></span>' + statusText + '</span></td>' +
        '<td>' + r.count + '</td></tr>';
    }).join('');

    return '<div class="chart-card">' +
      '<div class="chart-header"><div><span class="chart-title">Assessee Report</span>' +
      '<div class="chart-subtitle">' + rows.length + ' assessees, ranked by weighted score</div></div>' +
      '</div>' +
      '<div class="report-table-wrap"><table class="report-table"><thead><tr>' +
      '<th>UID</th><th>Name</th><th>Role</th><th>Score</th><th>Benchmark</th><th>Status</th><th>Records</th>' +
      '</tr></thead><tbody>' + (body || '<tr><td colspan="7" style="text-align:center;color:var(--color-text-tertiary)">No data for the current filters.</td></tr>') + '</tbody></table></div></div>';
  }

  function renderTabContent(filtered) {
    var el = document.getElementById('tab-content');
    if (activeTab === 'overview') el.innerHTML = tabOverview(filtered);
    else if (activeTab === 'competency') el.innerHTML = tabCompetency(filtered);
    else if (activeTab === 'role') el.innerHTML = tabRole(filtered);
    else el.innerHTML = tabAssessee(filtered);
  }

  /* ============================================================
     Master render
  ============================================================ */
  function renderAll() {
    var filtered = applyFilters();
    document.getElementById('filter-result-count').textContent = filtered.length + ' of ' + FACTS.length + ' records';
    var count = activeFilterCount();
    var badge = document.getElementById('active-count');
    badge.hidden = count === 0;
    badge.textContent = count;
    var kpiGrid = document.getElementById('kpi-grid');
    kpiGrid.hidden = activeTab !== 'overview';
    if (activeTab === 'overview') renderKpis(filtered);
    renderTabContent(filtered);
  }

  document.getElementById('page-status-legend').innerHTML = statusLegendHtml();
  renderTabsUI();
  renderAll();
};

  var activeTab = 'pending';

  TABS.forEach(function (t) { selectedIndexes[t.key] = new Set(); });
  var searchQuery = '';

  var tabsEl = document.getElementById('status-tabs');
  var tbody = document.getElementById('table-body');
  var searchInput = document.getElementById('search-input');
  var selectionHint = document.getElementById('selection-hint');
  var selectAllCheckbox = document.getElementById('select-all-checkbox');
  var markVerifiedBtn = document.getElementById('mark-verified-btn');
  var deleteBtn = document.getElementById('delete-btn');

  function requirementPillClass(req) {
    return req === 'Mandatory' ? 'pill tone-accent' : 'pill tone-success';
  }

  function visibleRows() {
    var rows = data[activeTab];
    if (!searchQuery) return rows.map(function (r, i) { return { row: r, index: i }; });
    var q = searchQuery.toLowerCase();
    return rows
      .map(function (r, i) { return { row: r, index: i }; })
      .filter(function (item) {
        return item.row.assesseeName.toLowerCase().indexOf(q) > -1 || item.row.assesseeUid.toLowerCase().indexOf(q) > -1;
      });
  }

  function renderTabs() {
    tabsEl.innerHTML = TABS.map(function (t) {
      return '<button type="button" class="status-tab' + (t.key === activeTab ? ' is-active' : '') + '" data-tab="' + t.key + '">' +
        t.label + '<span class="status-tab-count tone-' + t.tone + '">' + t.count + '</span></button>';
    }).join('');
  }

  function renderTable() {
    closeAllUiSelectMenus();
    var items = visibleRows();
    var selected = selectedIndexes[activeTab];

    tbody.innerHTML = items.map(function (item) {
      var r = item.row, i = item.index;
      var isChecked = selected.has(i);
      var isEditableAssessor = activeTab === 'pending';

      var assessorCell;
      if (isEditableAssessor) {
        assessorCell = '<div class="assessor-select-row">' +
          '<select class="assessor-select" data-assessor-select="' + i + '"><option value="">Select Assessor</option>' +
          ASSESSOR_POOL.map(function (a) { return '<option value="' + a.uid + '"' + (a.uid === r.assessorUid ? ' selected' : '') + '>' + a.name + ' (' + a.uid + ')</option>'; }).join('') +
          '</select>' +
          '<span class="assessor-role-tag">' + r.assessorRole + '</span>' +
          '</div>';
      } else {
        assessorCell = '<div><div class="cell-primary">' + r.assessorName + ' (' + r.assessorUid + ')</div>' +
          '<div class="cell-secondary">' + r.assessorRole + '</div></div>';
      }

      return '<tr class="' + (isChecked ? 'is-selected' : '') + '" data-row-index="' + i + '">' +
        '<td class="col-checkbox"><span class="row-checkbox' + (isChecked ? ' is-checked' : '') + '" data-row-toggle="' + i + '">' +
        '<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg></span></td>' +
        '<td>' + r.surveyId + '</td>' +
        '<td>' + r.assessmentId + '</td>' +
        '<td><div class="cell-primary">' + r.assesseeName + ' (' + r.assesseeUid + ')</div><div class="cell-secondary">' + r.assesseeRole + '</div></td>' +
        '<td>' + assessorCell + '</td>' +
        '<td><span class="' + requirementPillClass(r.requirement) + '">' + r.requirement + '</span></td>' +
        '</tr>';
    }).join('');

    enhanceSelects(tbody);
    updateToolbarState();
  }

  function updateToolbarState() {
    var selected = selectedIndexes[activeTab];
    var rows = data[activeTab];
    var count = selected.size;

    selectionHint.textContent = count > 0 ? count + ' selected' : '';
    deleteBtn.disabled = count === 0;

    if (activeTab !== 'pending') {
      markVerifiedBtn.disabled = true;
    } else {
      var allAssigned = count > 0;
      selected.forEach(function (i) {
        var r = rows[i];
        if (!r.assessorUid || !r.assessorName) allAssigned = false;
      });
      markVerifiedBtn.disabled = !allAssigned;
    }

    var allSelected = rows.length > 0 && selected.size === rows.length;
    selectAllCheckbox.classList.toggle('is-checked', allSelected);
  }

  tabsEl.addEventListener('click', function (e) {
    var btn = e.target.closest('[data-tab]');
    if (!btn) return;
    var key = btn.getAttribute('data-tab');
    if (key !== 'pending') return; /* only Verification Pending has a screen built out — the rest are visible but inert */
    activeTab = key;
    searchInput.value = '';
    searchQuery = '';
    renderTabs();
    renderTable();
  });

  searchInput.addEventListener('input', function () {
    searchQuery = searchInput.value.trim();
    renderTable();
  });

  selectAllCheckbox.addEventListener('click', function () {
    var selected = selectedIndexes[activeTab];
    var rows = data[activeTab];
    if (selected.size === rows.length) {
      selected.clear();
    } else {
      rows.forEach(function (r, i) { selected.add(i); });
    }
    renderTable();
  });

  tbody.addEventListener('click', function (e) {
    var toggle = e.target.closest('[data-row-toggle]');
    if (toggle) {
      var i = Number(toggle.getAttribute('data-row-toggle'));
      var selected = selectedIndexes[activeTab];
      if (selected.has(i)) selected.delete(i); else selected.add(i);
      renderTable();
    }
  });

  tbody.addEventListener('change', function (e) {
    var sel = e.target.closest('[data-assessor-select]');
    if (!sel) return;
    var i = Number(sel.getAttribute('data-assessor-select'));
    var row = data[activeTab][i];
    row.assessorUid = sel.value;
    var match = ASSESSOR_POOL.find(function (a) { return a.uid === sel.value; });
    row.assessorName = match ? match.name : '';
    renderTable();
  });

  markVerifiedBtn.addEventListener('click', function () {
    if (markVerifiedBtn.disabled) return;
    var selected = Array.from(selectedIndexes[activeTab]).sort(function (a, b) { return b - a; });
    selected.forEach(function (i) {
      var row = data.pending.splice(i, 1)[0];
      data.verified.unshift(row);
    });
    TABS[0].count -= selected.length;
    TABS[1].count += selected.length;
    selectedIndexes.pending.clear();
    renderTabs();
    renderTable();
  });

  deleteBtn.addEventListener('click', function () {
    if (deleteBtn.disabled) return;
    var selected = Array.from(selectedIndexes[activeTab]).sort(function (a, b) { return b - a; });
    selected.forEach(function (i) { data[activeTab].splice(i, 1); });
    var tab = TABS.find(function (t) { return t.key === activeTab; });
    tab.count -= selected.length;
    selectedIndexes[activeTab].clear();
    renderTabs();
    renderTable();
  });

  renderTabs();
  renderTable();
};

PAGE_INIT['group-create'] = function () {
  var actionBar = document.getElementById('action-bar');
  actionBar.innerHTML = ACTION_BAR_HTML.groupCreate;
  actionBar.hidden = false;

  var cancelCreateGroupBtn = document.getElementById('cancel-create-group-btn');
  if (cancelCreateGroupBtn) cancelCreateGroupBtn.addEventListener('click', function () { groupView = 'list'; renderApp(); });

        }).join('');
      return '<div class="competency-card">' +
        '<div class="competency-card-header">' +
        '<span class="competency-name">' + c.name + '</span>' +
        '<div class="competency-card-actions">' +
        '<button class="icon-btn-plain" aria-label="Edit competency"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M17 3a2.85 2.83 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z"/></svg></button>' +
        '<button class="icon-btn-plain" aria-label="Delete competency" data-delete-competency="' + i + '"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg></button>' +
        '</div></div>' +

        '<div class="attribute-row">' + blocks + '</div>' +

    competencies.splice(i, 1);
    renderCompetencyCards();
    updateActionBarStatus();
  });

  var drawer = document.getElementById('competency-drawer');
  var scrim = document.getElementById('drawer-scrim');
  var syncRow = document.getElementById('sync-chip-row');
  var attributesGrid = document.getElementById('attributes-grid');

  var levelsMultiselect = document.getElementById('levels-multiselect');
  var levelsMenu = document.getElementById('levels-multiselect-menu');
  var levelsLabel = document.getElementById('levels-multiselect-label');
  var levelsChipRow = document.getElementById('levels-chip-row');

  function renderLevelsMenu() {
    levelsMenu.innerHTML = PROFICIENCY_LEVELS.map(function (level) {
      var checked = selectedLevels.indexOf(level) > -1;
      return '<label class="multiselect-option">' +
        '<span class="multiselect-checkbox' + (checked ? ' is-checked' : '') + '" data-level-toggle="' + level + '">' +
        '<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>' +
        '</span>' + level + '</label>';
    }).join('');
  }

  function renderLevelsChips() {
    levelsLabel.textContent = selectedLevels.length + ' of ' + PROFICIENCY_LEVELS.length + ' selected';
    levelsChipRow.innerHTML = selectedLevels.map(function (level) {
      return '<span class="chip-removable">' + level +

        '</button></span>';
    }).join('');
  }

  function onLevelsChanged() {
    renderLevelsMenu();
    renderLevelsChips();
    if (!drawer.hidden) {
      updateSync();
      updateSaveButtonState();
    }
    updateActionBarStatus();
  }

  levelsMenu.addEventListener('click', function (e) {
    var toggle = e.target.closest('[data-level-toggle]');
    if (!toggle) return;
    var level = toggle.getAttribute('data-level-toggle');
    var idx = selectedLevels.indexOf(level);
    if (idx > -1) selectedLevels.splice(idx, 1);
    else selectedLevels.push(level);
    onLevelsChanged();
  });

  levelsChipRow.addEventListener('click', function (e) {
    var btn = e.target.closest('[data-level-remove]');
    if (!btn) return;
    var level = btn.getAttribute('data-level-remove');
    var idx = selectedLevels.indexOf(level);
    if (idx > -1) selectedLevels.splice(idx, 1);
    onLevelsChanged();
  });

  document.getElementById('levels-multiselect-trigger').addEventListener('click', function (e) {
    e.stopPropagation();
    levelsMultiselect.classList.toggle('is-open');
  });
  document.addEventListener('click', function (e) {
    if (!levelsMultiselect.contains(e.target)) levelsMultiselect.classList.remove('is-open');
  });

  function syncAttributesGrid() {
    var draft = {};
    attributesGrid.querySelectorAll('textarea').forEach(function (ta) {
      draft[ta.getAttribute('data-level')] = ta.value;
    });
    attributesGrid.innerHTML = selectedLevels.map(function (level) {
      var id = 'attr-' + level.toLowerCase();
      var val = draft[level] || '';
      return '<div class="field">' +
        '<label class="field-label" for="' + id + '">' + level + ' Attributes<span class="required">*</span></label>' +
        '<textarea class="textarea-input" id="' + id + '" data-level="' + level + '" placeholder="Enter ' + level.toLowerCase() + ' detail">' + val + '</textarea>' +
        '</div>';
    }).join('');
  }

  function updateSync() {
    syncRow.innerHTML = '<span class="sync-chip">' + selectedLevels.join(', ') + '</span>';
    syncAttributesGrid();
  }

  var groupNameInput = document.getElementById('group-name');
  var groupDescInput = document.getElementById('group-desc');
  var statusIcon = document.getElementById('status-icon');
  var statusText = document.getElementById('status-text');
  var createGroupBtn = document.getElementById('create-group-btn');

  function updateActionBarStatus() {
    var missing = [];
    if (!groupNameInput.value.trim()) missing.push('a group name');
    if (!groupDescInput.value.trim()) missing.push('a description');
    if (selectedLevels.length === 0) missing.push('at least one proficiency level');
    var hasCompetency = document.querySelectorAll('.competency-card').length > 0;
    if (!hasCompetency) missing.push('at least one competency');

    var isComplete = missing.length === 0;
    createGroupBtn.disabled = !isComplete;
    statusIcon.classList.toggle('is-complete', isComplete);
    statusIcon.classList.toggle('is-incomplete', !isComplete);
    statusText.textContent = isComplete
      ? 'All required fields are complete.'
      : 'Add ' + missing.join(', ') + ' to continue.';
  }

  groupNameInput.addEventListener('input', updateActionBarStatus);
  groupDescInput.addEventListener('input', updateActionBarStatus);

  createGroupBtn.addEventListener('click', function () {
    if (createGroupBtn.disabled) return;
    groupView = 'list';
    renderApp();
  });

  var competenciesPanel = document.getElementById('competencies-panel');

  var compNameInput = document.getElementById('comp-name');
  var compDescInput = document.getElementById('comp-desc');
  var saveCompetencyBtn = document.getElementById('save-competency-btn');

  function updateSaveButtonState() {
    var valid = !!compNameInput.value.trim() && !!compDescInput.value.trim();
    attributesGrid.querySelectorAll('textarea').forEach(function (ta) {
      if (!ta.value.trim()) valid = false;
    });
    saveCompetencyBtn.disabled = !valid;
  }

  function resetCompetencyForm() {
    compNameInput.value = '';
    compDescInput.value = '';
    attributesGrid.querySelectorAll('textarea').forEach(function (ta) { ta.value = ''; });
  }

  compNameInput.addEventListener('input', updateSaveButtonState);
  compDescInput.addEventListener('input', updateSaveButtonState);
  attributesGrid.addEventListener('input', updateSaveButtonState);

  saveCompetencyBtn.addEventListener('click', function () {
    if (saveCompetencyBtn.disabled) return;
    var attributes = {};
    attributesGrid.querySelectorAll('textarea').forEach(function (ta) {
      attributes[ta.getAttribute('data-level')] = ta.value.trim();
    });
    competencies.push({
      name: compNameInput.value.trim(),
      description: compDescInput.value.trim(),
      attributes: attributes
    });
    renderCompetencyCards();
    updateActionBarStatus();
    resetCompetencyForm();
    closeDrawer();
  });

  function openDrawer() {
    resetCompetencyForm();
    updateSync();
    updateSaveButtonState();
    drawer.hidden = false;
    scrim.hidden = false;
    competenciesPanel.classList.add('drawer-open');
  }
  function closeDrawer() {
    drawer.hidden = true;
    scrim.hidden = true;
    competenciesPanel.classList.remove('drawer-open');
  }

  document.getElementById('open-drawer-btn').addEventListener('click', openDrawer);
  document.getElementById('close-drawer-btn').addEventListener('click', closeDrawer);
  document.getElementById('cancel-drawer-btn').addEventListener('click', closeDrawer);
  scrim.addEventListener('click', closeDrawer);

  renderLevelsMenu();
  renderLevelsChips();
  renderCompetencyCards();
  updateActionBarStatus();
};

  var roleDescInput = document.getElementById('role-desc');
  var statusIcon = document.getElementById('status-icon');
  var statusText = document.getElementById('status-text');
  var createRoleBtn = document.getElementById('create-role-btn');

  function updateActionBarStatus() {
    var missing = [];
    if (!roleTypeSelect.value) missing.push('a role type');
    if (!roleNameInput.value.trim()) missing.push('a role name');
    if (!roleDescInput.value.trim()) missing.push('a role description');
    var anyGroupSelected = groups.some(function (g) { return g.selected; });
    if (!anyGroupSelected) missing.push('at least one competency group');
    var anyCompetencyChecked = groups.some(function (g) {
      return g.selected && g.competencies.some(function (c) { return c.checked; });
    });
    if (anyGroupSelected && !anyCompetencyChecked) missing.push('at least one competency to assess');

    var isComplete = missing.length === 0;
    createRoleBtn.disabled = !isComplete;
    statusIcon.classList.toggle('is-complete', isComplete);
    statusIcon.classList.toggle('is-incomplete', !isComplete);
    statusText.textContent = isComplete
      ? 'All required fields are complete.'
      : 'Add ' + joinList(missing) + ' to continue.';
  }

  function joinList(items) {
    if (items.length <= 1) return items.join('');
    if (items.length === 2) return items.join(' and ');
    return items.slice(0, -1).join(', ') + ', and ' + items[items.length - 1];
  }

  roleTypeSelect.addEventListener('change', updateActionBarStatus);
  roleNameInput.addEventListener('input', updateActionBarStatus);
  roleDescInput.addEventListener('input', updateActionBarStatus);

  createRoleBtn.addEventListener('click', function () {
    if (createRoleBtn.disabled) return;
    roleView = 'list';
    renderApp();
  });

  renderAll();
};
PAGE_INIT['role-mapping'] = function () {

  var ASSESSOR_ROLE_POOL = ['CAT Manager', 'MD', 'Test Manager', 'CDS Leader', 'UCF Manager', 'Manager', 'Tech Lead', 'Engineering Mgr', 'Design Lead', 'QA Manager', 'VP Product', 'Analytics Lead', 'Infra Manager', 'CISO'];

  var MAPPINGS = [
    { id: 'RI001', role: 'CAT Developer', assessorRoles: [{ name: 'CAT Manager', mandatory: true }, { name: 'Engineering Mgr', mandatory: false }] },
    { id: 'RI002', role: 'P-MD', assessorRoles: [{ name: 'MD', mandatory: true }] },
    { id: 'RI003', role: 'Tester', assessorRoles: [{ name: 'CAT Manager', mandatory: true }, { name: 'Test Manager', mandatory: false }, { name: 'CDS Leader', mandatory: false }] },
    { id: 'RI004', role: 'Zop', assessorRoles: [{ name: 'UCF Manager', mandatory: true }] },

    { id: 'RI006', role: 'Manual Tester', assessorRoles: [{ name: 'UCF Manager', mandatory: true }] },
    { id: 'RI007', role: 'People Manager', assessorRoles: [{ name: 'VP Product', mandatory: true }, { name: 'CISO', mandatory: false }] },
    { id: 'RI008', role: 'Executive', assessorRoles: [{ name: 'CISO', mandatory: true }] }
  ];

  function defaultDraftRows() {
    return [
      { role: '', mandatory: true }
    ];
  }
  var draftRows = defaultDraftRows();

  var assesseeSelect = document.getElementById('mapping-assessee-role');
  assesseeSelect.innerHTML = '<option value="">Select Assessee Role</option>' +
    ASSESSEE_ROLES.map(function (r) { return '<option value="' + r + '">' + r + '</option>'; }).join('');

  var rowsContainer = document.getElementById('mapping-assessor-rows');
  var listContainer = document.getElementById('mapping-list');
  var subtitleEl = document.getElementById('mapping-create-subtitle');
  var summaryCountsEl = document.getElementById('mapping-summary-counts');
  var summaryCaptionEl = document.getElementById('mapping-summary-caption');
  var createBody = document.getElementById('mapping-create-body');
  var collapseBtn = document.getElementById('mapping-collapse-btn');
  var totalPill = document.getElementById('mapping-total-pill');
  var saveBtn = document.getElementById('mapping-save-btn');

  function assessorRoleOptionsHtml(selected) {
    return '<option value="">Select Assessor Role</option>' + ASSESSOR_ROLE_POOL.map(function (r) {
      return '<option value="' + r + '"' + (r === selected ? ' selected' : '') + '>' + r + '</option>';
    }).join('');
  }

  function renderRows() {
    rowsContainer.innerHTML = draftRows.map(function (row, i) {
      return '<div class="mapping-assessor-row">' +
        '<select class="select-input" data-row-role="' + i + '">' + assessorRoleOptionsHtml(row.role) + '</select>' +
        '<span class="mapping-mandatory-label">Mandatory</span>' +
        '<span class="toggle-switch' + (row.mandatory ? ' is-on' : '') + '" data-row-toggle="' + i + '"><span class="toggle-knob"></span></span>' +
        (i === 0 ? '' :
        '<button type="button" class="icon-btn-plain" data-row-delete="' + i + '" aria-label="Remove assessor role">' +
        '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>' +
        '</button>') + '</div>';
    }).join('');
    enhanceSelects(rowsContainer);
    renderSummary();
  }

  function renderSummary() {
    var mappedRows = draftRows.filter(function (r) { return r.role; });
    var mandatoryCount = mappedRows.filter(function (r) { return r.mandatory; }).length;
    var optionalCount = mappedRows.length - mandatoryCount;
    summaryCountsEl.textContent = mappedRows.length ? (mandatoryCount + ' Mandatory   ' + optionalCount + ' Optional') : '';
    summaryCaptionEl.textContent = mappedRows.length ? (mappedRows.length + ' Assessor role' + (mappedRows.length === 1 ? '' : 's') + ' mapped') : '';
    subtitleEl.textContent = assesseeSelect.value ? (assesseeSelect.value + ' selected') : 'No Assessee role added yet';
    updateSaveButtonState();
  }

  function updateSaveButtonState() {
    var hasValidRow = draftRows.length > 0 && draftRows.every(function (r) { return r.role; });
    saveBtn.disabled = !assesseeSelect.value || !hasValidRow;
  }

  var PAGE_SIZE = 5;
  var currentPage = 1;
  var paginationSummaryEl = document.getElementById('mapping-pagination-summary');
  var paginationControlsEl = document.getElementById('mapping-pagination-controls');

  function renderPagination() {
    var totalPages = Math.max(1, Math.ceil(MAPPINGS.length / PAGE_SIZE));
    if (currentPage > totalPages) currentPage = totalPages;
    var start = (currentPage - 1) * PAGE_SIZE + 1;
    var end = Math.min(currentPage * PAGE_SIZE, MAPPINGS.length);
    paginationSummaryEl.textContent = MAPPINGS.length ? ('Showing ' + start + '–' + end + ' of ' + MAPPINGS.length) : 'Showing 0 of 0';
    var html = '<button class="page-btn page-btn-nav' + (currentPage === 1 ? ' is-disabled' : '') + '" id="mapping-prev-btn"' + (currentPage === 1 ? ' disabled' : '') + '>' +
      '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg></button>';
    for (var p = 1; p <= totalPages; p++) {
      html += '<button class="page-btn' + (p === currentPage ? ' is-active' : '') + '" data-page="' + p + '">' + p + '</button>';
    }
    html += '<button class="page-btn page-btn-nav' + (currentPage === totalPages ? ' is-disabled' : '') + '" id="mapping-next-btn"' + (currentPage === totalPages ? ' disabled' : '') + '>Next' +
      '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg></button>';
    paginationControlsEl.innerHTML = html;
  }

  paginationControlsEl.addEventListener('click', function (e) {
    var prev = e.target.closest('#mapping-prev-btn');
    var next = e.target.closest('#mapping-next-btn');
    var pageBtn = e.target.closest('[data-page]');
    if (prev && !prev.disabled) currentPage--;
    else if (next && !next.disabled) currentPage++;
    else if (pageBtn) currentPage = Number(pageBtn.getAttribute('data-page'));
    else return;
    renderList();
    renderPagination();
  });

  function renderList() {
    var start = (currentPage - 1) * PAGE_SIZE;
    listContainer.innerHTML = MAPPINGS.slice(start, start + PAGE_SIZE).map(function (m) {
      var count = m.assessorRoles.length;
      return '<div class="mapping-list-item" data-expanded="false">' +
        '<div class="mapping-list-item-left"><span class="pill pill-accent-tint pill-lg">' + m.id + '</span>' +
        '<span class="mapping-role-name">' + m.role + '</span></div>' +
        '<div class="mapping-list-item-right">' +
        '<div class="mapping-tagged-caption">Assessors role tagged (' + (count < 10 ? '0' + count : count) + ')</div>' +
        '<div class="pill-row">' + m.assessorRoles.map(function (ar) {
          return '<span class="pill pill-accent-tint pill-lg">' + ar.name + ' (' + (ar.mandatory ? 'M' : 'O') + ')</span>';
        }).join('') + '</div></div>' +
        '<button type="button" class="icon-btn mapping-expand-btn" aria-label="Expand">' +
        '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>' +
        '</button></div>';
    }).join('');
  }

  assesseeSelect.addEventListener('change', renderSummary);

  rowsContainer.addEventListener('change', function (e) {
    var sel = e.target.closest('[data-row-role]');
    if (!sel) return;
    draftRows[Number(sel.getAttribute('data-row-role'))].role = sel.value;
    renderSummary();
  });

  rowsContainer.addEventListener('click', function (e) {
    var toggle = e.target.closest('[data-row-toggle]');
    if (toggle) {
      draftRows[Number(toggle.getAttribute('data-row-toggle'))].mandatory = !draftRows[Number(toggle.getAttribute('data-row-toggle'))].mandatory;
      renderRows();
      return;
    }
    var del = e.target.closest('[data-row-delete]');
    if (del) {
      draftRows.splice(Number(del.getAttribute('data-row-delete')), 1);
      renderRows();
    }
  });

  document.getElementById('mapping-add-role-btn').addEventListener('click', function () {
    draftRows.push({ role: '', mandatory: false });
    renderRows();
  });

  function collapsePanel() {
    createBody.hidden = true;
    collapseBtn.classList.add('is-collapsed');
    collapseBtn.setAttribute('aria-label', 'Expand');
  }
  function expandPanel() {
    createBody.hidden = false;
    collapseBtn.classList.remove('is-collapsed');
    collapseBtn.setAttribute('aria-label', 'Collapse');
  }
  function resetDraft() {
    assesseeSelect.value = '';
    draftRows = defaultDraftRows();
    renderRows();
  }

  document.getElementById('mapping-cancel-btn').addEventListener('click', function () {
    resetDraft();
    collapsePanel();
  });

  document.getElementById('mapping-save-btn').addEventListener('click', function () {
    if (!assesseeSelect.value || draftRows.length === 0) return;
    var nextNum = MAPPINGS.length + 1;
    var idNum = nextNum < 10 ? '00' + nextNum : (nextNum < 100 ? '0' + nextNum : '' + nextNum);
    MAPPINGS.unshift({
      id: 'RI' + idNum,
      role: assesseeSelect.value,
      assessorRoles: draftRows.map(function (r) { return { name: r.role, mandatory: r.mandatory }; })
    });
    totalPill.textContent = 'Total records: ' + MAPPINGS.length;
    currentPage = 1;
    resetDraft();
    renderList();
    renderPagination();
    collapsePanel();
  });

  collapseBtn.addEventListener('click', function (e) {
    e.stopPropagation();
    if (createBody.hidden) expandPanel(); else collapsePanel();
  });

  document.getElementById('mapping-create-panel').addEventListener('click', function () {
    if (createBody.hidden) expandPanel();
  });

  listContainer.addEventListener('click', function (e) {
    var expandBtn = e.target.closest('.mapping-expand-btn');
    if (!expandBtn) return;
    var item = expandBtn.closest('.mapping-list-item');
    item.setAttribute('data-expanded', item.getAttribute('data-expanded') === 'true' ? 'false' : 'true');
  });

  renderRows();
  renderList();
  renderPagination();
};

    g.competencies.forEach(function (c, ci) {
      ASSESSEES.forEach(function (a, ai) {
        ratings[gi + '|' + ci + '|' + ai] = { level: '', comment: '' };
      });
    });
  });
  var openComments = {};

  var headRow = document.querySelector('.matrix-table thead tr');
  var placeholder = document.getElementById('matrix-head-cells');
  ASSESSEES.forEach(function (a) {
    var th = document.createElement('th');
    th.innerHTML = '<span class="assessee-col-name">' + a.name + '</span><br><span class="assessee-col-uid">' + a.uid + '</span>';
    headRow.appendChild(th);
  });
  placeholder.remove();

  var tbody = document.getElementById('matrix-body');

  function render() {
    closeAllUiSelectMenus();
    var rowsHtml = '';
    GROUPS.forEach(function (g, gi) {
      rowsHtml += '<tr class="group-divider-row"><td colspan="' + (ASSESSEES.length + 1) + '">' + g.name + '</td></tr>';
      g.competencies.forEach(function (c, ci) {
        var infoKey = gi + '|' + ci;
        var infoOpen = !!openInfo[infoKey];
        rowsHtml += '<tr><td class="col-competency"><span class="competency-name">' + c.name + '</span>' +
          '<span class="expected-note">Expected: ' + c.expectedLevel + '' +
          '<button type="button" class="info-icon-btn' + (infoOpen ? ' is-active' : '') + '" data-toggle-info="' + infoKey + '" aria-label="View expected level detail">' +
          '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/></svg>' +
          '</button></span></td>';
        ASSESSEES.forEach(function (a, ai) {
          var key = gi + '|' + ci + '|' + ai;
          var r = ratings[key];
          rowsHtml += '<td><div class="cell-rating">' +
            '<select class="level-select' + (r.level ? '' : ' is-empty') + '" data-level="' + key + '">' +
            '<option value="">Choose</option>' +
            LEVELS.map(function (l) { return '<option value="' + l + '"' + (l === r.level ? ' selected' : '') + '>' + l + '</option>'; }).join('') +
            '</select>' +
            '<button type="button" class="comment-btn' + (r.comment ? ' has-comment' : '') + '" data-toggle-comment="' + key + '" title="' + (r.comment ? r.comment.replace(/"/g,'&quot;') : 'Add comment') + '">' +
            '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>' +
            '</button></div></td>';
        });
        rowsHtml += '</tr>';
        if (infoOpen) {
          rowsHtml += '<tr><td class="col-competency" style="font-size:var(--fs-label);color:var(--color-text-tertiary)">Expected level detail</td>' +
            '<td colspan="' + ASSESSEES.length + '" class="expected-info-panel-text"><strong>' + c.expectedLevel + ':</strong> ' + c.expectedLevelComment + '</td></tr>';
        }
        if (openComments[gi + '|' + ci] !== undefined && openComments[gi + '|' + ci] !== null) {
          var ai2 = openComments[gi + '|' + ci];
          var key2 = gi + '|' + ci + '|' + ai2;
          rowsHtml += '<tr><td class="col-competency" style="font-size:var(--fs-label);color:var(--color-text-tertiary)">Comment — ' + ASSESSEES[ai2].name + '</td>' +
            '<td colspan="' + ASSESSEES.length + '"><input type="text" class="level-select" style="width:100%" data-comment="' + key2 + '" placeholder="Write short comment" value="' + ratings[key2].comment.replace(/"/g,'&quot;') + '"></td></tr>';
        }
      });
    });
    tbody.innerHTML = rowsHtml;
    enhanceSelects(tbody);
    updateOverall();
  }

  function updateOverall() {
    var filled = Object.keys(ratings).filter(function (k) { return ratings[k].level; }).length;
    document.getElementById('overall-text').textContent = filled + ' of ' + totalCells + ' rated';
    document.getElementById('overall-fill').style.width = Math.round((filled / totalCells) * 100) + '%';
    var complete = filled === totalCells;
    document.getElementById('submit-btn').disabled = !complete;
    document.getElementById('submit-hint').textContent = complete ? 'All assessees rated — ready to submit.' : 'Rate every assessee to submit this survey.';
  }

  tbody.addEventListener('click', function (e) {
    var infoBtn = e.target.closest('[data-toggle-info]');
    if (infoBtn) {
      var infoKey = infoBtn.getAttribute('data-toggle-info');
      openInfo[infoKey] = !openInfo[infoKey];
      render();
      return;
    }
    var btn = e.target.closest('[data-toggle-comment]');
    if (!btn) return;
    var parts = btn.getAttribute('data-toggle-comment').split('|');
    var rowKey = parts[0] + '|' + parts[1];
    var ai = Number(parts[2]);
    openComments[rowKey] = openComments[rowKey] === ai ? null : ai;
    render();
  });

  tbody.addEventListener('change', function (e) {
    var sel = e.target.closest('[data-level]');
    if (sel) {
      ratings[sel.getAttribute('data-level')].level = sel.value;
      render();
    }
  });
  tbody.addEventListener('input', function (e) {
    var input = e.target.closest('[data-comment]');
    if (input) ratings[input.getAttribute('data-comment')].comment = input.value;
  });

  render();
};

/* ============================================================
   Boot
============================================================ */
renderApp();
</script>

</body>
</html>

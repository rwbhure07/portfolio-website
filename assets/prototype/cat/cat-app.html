<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Competency Assessment Tool</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --color-bg: #f4f5f6;
    --color-sidebar-bg: #eef1f4;
    --color-card: #ffffff;
    --color-text-primary: #12233d;
    --color-text-secondary: #5a6a7d;
    --color-text-tertiary: #6b7480;
    --color-accent: #1668e3;
    --color-accent-hover: #1253ba;
    --color-accent-disabled: #93bcf3;
    --color-accent-tint-bg: #f2f5fa;
    --color-accent-tint-text: #006ce6;
    --color-neutral-tint-bg: #eef0f2;
    --color-neutral-tint-text: #3c4757;
    --color-success-tint-bg: #dcfce7;
    --color-success-tint-text: #16a34a;
    --color-warning-tint-bg: #fef3c7;
    --color-warning-tint-text: #b45309;
    --color-danger-tint-bg: #fee2e2;
    --color-danger-tint-text: #b91c1c;
    --color-border: #d7dbe0;
    --color-border-light: #e3e6ea;
    --color-border-lighter: #edeff2;
    --color-required: #ef4444;
    --color-scrim: rgba(60, 71, 87, 0.55);
    --color-dot-red: #f4785a;
    --color-dot-cyan: #6fd3e8;
    --color-dot-purple: #8b7ef0;
    --color-dot-slate: #6b7480;
    --color-dot-teal: #2fbf9f;
    --radius-sm: 8px; --radius-md: 10px; --radius-lg: 12px; --radius-pill: 999px;
    --space-1: 4px; --space-2: 8px; --space-3: 12px; --space-4: 16px; --space-5: 20px; --space-6: 24px; --space-8: 32px;
    --font-body: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
    --fs-page-title: 25px; --fs-app-title: 17px; --fs-record-name: 17px; --fs-body: 14px; --fs-small: 13px; --fs-label: 11px;
    --shadow-card: 0 1px 2px rgba(18, 35, 61, 0.04), 0 8px 24px rgba(18, 35, 61, 0.06);
    --shadow-drawer: 0 -12px 32px rgba(18, 35, 61, 0.18);

    --viz-blue-700: #1d4ed8;
    --viz-blue-500: #1668e3;
    --viz-blue-300: #7ea6ef;
    --viz-blue-100: #dbeafe;
    --viz-benchmark: #b7bcc4;
    --viz-good-bg: #dcfce7; --viz-good-text: #15803d; --viz-good: #16a34a;
    --viz-warning-bg: #fef3c7; --viz-warning-text: #b45309; --viz-warning: #d97706;
    --viz-critical-bg: #fee2e2; --viz-critical-text: #b91c1c; --viz-critical: #dc2626;
    --viz-ink-secondary: #5a6a7d;
    --viz-ink-muted: #8a94a3;
    --viz-grid: #e7eaee;
  }

  * , *::before, *::after { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; background: var(--color-border); color: var(--color-text-primary); font-family: var(--font-body); font-size: var(--fs-body); line-height: 1.5; overflow: hidden; }
  h1, h2, h3 { margin: 0; font-weight: 700; }
  button { font-family: inherit; cursor: pointer; }
  input, select, textarea { font-family: inherit; }

  /* ============ app shell (full-bleed, edge-to-edge — matches the Figma export frames) ============ */
  .app-shell { width: 1440px; max-width: 100%; height: 100vh; margin: 0 auto; display: flex; flex-direction: column; background: var(--color-card); overflow: hidden; }

  .topbar { height: 64px; flex: none; display: flex; align-items: center; justify-content: space-between; gap: var(--space-4); padding: 0 var(--space-6); border-bottom: 1px solid var(--color-border-light); background: var(--color-card); }
  .topbar-left { display: flex; align-items: center; gap: var(--space-3); }
  .logo-mark { width: 32px; height: 32px; flex: none; display: block; }
  .logo-mark img { width: 100%; height: 100%; display: block; object-fit: contain; }
  .app-title { font-size: var(--fs-app-title); font-weight: 700; color: var(--color-text-primary); }
  .breadcrumb { font-size: var(--fs-app-title); font-weight: 500; color: var(--color-text-secondary); }
  .topbar-right { display: flex; align-items: center; gap: var(--space-3); }
  .icon-btn { width: 36px; height: 36px; flex: none; display: flex; align-items: center; justify-content: center; background: var(--color-card); border: 1px solid var(--color-border-light); border-radius: var(--radius-md); color: var(--color-text-secondary); }
  .icon-btn:hover { background: var(--color-border-lighter); }
  .avatar { width: 36px; height: 36px; flex: none; border-radius: var(--radius-pill); overflow: hidden; }
  .avatar img { width: 100%; height: 100%; display: block; object-fit: cover; }

  .app-body { display: flex; align-items: stretch; flex: 1; min-height: 0; overflow: hidden; }
  .sidebar { width: 238px; flex: none; display: flex; flex-direction: column; gap: var(--space-6); padding: var(--space-5) var(--space-3); background: var(--color-sidebar-bg); border-right: 1px solid var(--color-border-light); overflow-y: auto; }
  .nav-list { display: flex; flex-direction: column; gap: var(--space-1); }
  .nav-item { display: flex; align-items: center; gap: var(--space-3); padding: var(--space-3); border-radius: var(--radius-md); color: var(--color-text-secondary); text-decoration: none; font-size: var(--fs-body); font-weight: 500; }
  .nav-item svg { flex: none; }
  .nav-icon-mask { display: inline-block; flex: none; width: 18px; height: 18px; background-color: currentColor; -webkit-mask-size: contain; mask-size: contain; -webkit-mask-repeat: no-repeat; mask-repeat: no-repeat; -webkit-mask-position: center; mask-position: center; }
  .nav-item:hover { background: rgba(255, 255, 255, 0.6); }
  .nav-item.is-active { background: var(--color-card); color: var(--color-accent); font-weight: 600; box-shadow: 0 1px 2px rgba(18, 35, 61, 0.06); }

  .sidebar-section { display: flex; flex-direction: column; gap: var(--space-3); padding: 0 var(--space-3); }
  .sidebar-section-title { font-size: var(--fs-small); font-weight: 700; color: var(--color-text-primary); }
  .activity-list { display: flex; flex-direction: column; gap: var(--space-3); }
  .activity-item { display: flex; align-items: flex-start; gap: var(--space-2); font-size: var(--fs-small); color: var(--color-text-secondary); }
  .activity-dot { width: 8px; height: 8px; flex: none; margin-top: 5px; border-radius: var(--radius-pill); }

  .content-col { flex: 1; min-width: 0; display: flex; flex-direction: column; min-height: 0; }
  .content { flex: 1; min-width: 0; min-height: 0; padding: var(--space-4); background: var(--color-bg); overflow-y: auto; }
  #page-root { height: 100%; }
  .content-inner { display: flex; flex-direction: column; gap: var(--space-4); }
  .breadcrumb-sub { font-size: var(--fs-small); color: var(--color-text-tertiary); }
  .page-title { font-size: var(--fs-page-title); }
  .page-header { display: flex; align-items: center; justify-content: space-between; gap: var(--space-4); }

  .content-card { display: flex; flex-direction: column; gap: 16px; background: var(--color-card); border: 1px solid var(--color-border-light); border-radius: var(--radius-lg); padding: 16px; }
  .content-header { display: flex; align-items: center; justify-content: space-between; gap: var(--space-4); flex-wrap: wrap; }
  .content-header-title { display: flex; align-items: center; gap: var(--space-3); }
  .content-header-title h1 { font-size: var(--fs-page-title); }
  .content-header-controls { display: flex; align-items: center; gap: var(--space-3); }

  /* ---- buttons ---- */
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: var(--space-2); height: 40px; padding: 0 var(--space-5); border-radius: var(--radius-md); border: 1px solid transparent; font-size: var(--fs-body); font-weight: 600; }
  .btn-primary { background: var(--color-accent); color: #ffffff; }
  .btn-primary:hover { background: var(--color-accent-hover); }
  .btn-primary[disabled] { background: var(--color-accent-disabled); cursor: not-allowed; }
  .btn-secondary { background: var(--color-card); border-color: var(--color-border); color: var(--color-text-primary); }
  .btn-secondary:hover { background: var(--color-border-lighter); }
  .btn-secondary[disabled] { color: var(--color-text-tertiary); background: var(--color-border-lighter); cursor: not-allowed; }
  .btn-sm { height: 32px; padding: 0 var(--space-3); font-size: var(--fs-small); }
  .btn-text { background: transparent; border-color: transparent; color: var(--color-text-secondary); padding: 0 var(--space-3); }
  .btn-text:hover { background: var(--color-border-lighter); color: var(--color-text-primary); }
  .icon-btn-plain { width: 28px; height: 28px; flex: none; display: flex; align-items: center; justify-content: center; border: none; background: transparent; border-radius: var(--radius-sm); color: var(--color-text-secondary); }
  .icon-btn-plain:hover { background: var(--color-neutral-tint-bg); }

  /* ---- pills ---- */
  .pill { display: inline-flex; align-items: center; gap: var(--space-1); height: 26px; padding: 0 var(--space-3); border-radius: var(--radius-pill); font-size: var(--fs-small); font-weight: 600; white-space: nowrap; }
  .pill-accent-tint { background: var(--color-accent-tint-bg); color: var(--color-accent-tint-text); }
  .pill-neutral-tint { background: var(--color-neutral-tint-bg); color: var(--color-neutral-tint-text); }
  .pill-outline { background: var(--color-card); border: 1px solid var(--color-border); color: var(--color-text-primary); font-weight: 500; }
  .pill-row { display: flex; flex-wrap: wrap; gap: var(--space-2); }
  .tone-warning { background: var(--color-warning-tint-bg); color: var(--color-warning-tint-text); }
  .tone-accent { background: var(--color-accent-tint-bg); color: var(--color-accent-tint-text); }
  .tone-success { background: var(--color-success-tint-bg); color: var(--color-success-tint-text); }
  .tone-danger { background: var(--color-danger-tint-bg); color: var(--color-danger-tint-text); }

  /* ---- fields / inputs ---- */
  .field { display: flex; flex-direction: column; gap: var(--space-2); }
  .field-group { display: flex; flex-direction: column; gap: var(--space-5); }
  .field-label { font-size: var(--fs-body); font-weight: 600; color: var(--color-text-primary); }
  .field-hint { font-size: var(--fs-small); color: var(--color-text-tertiary); }
  .field-caption { font-size: var(--fs-small); color: var(--color-text-tertiary); margin: 0; }
  .required { color: var(--color-required); margin-left: 2px; }
  .text-input, .textarea-input, .select-input { width: 100%; padding: var(--space-3); border: 1px solid var(--color-border); border-radius: var(--radius-md); font-size: var(--fs-body); color: var(--color-text-primary); background: var(--color-card); }
  .text-input::placeholder, .textarea-input::placeholder { color: var(--color-text-tertiary); }
  .textarea-input { resize: vertical; min-height: 96px; line-height: 1.6; }
  .field-footer { display: flex; justify-content: flex-end; }
  .char-count { font-size: var(--fs-small); color: var(--color-text-tertiary); }

  /* ---- custom select (replaces native <select> popups app-wide) ---- */
  .ui-select { position: relative; display: inline-flex; align-items: center; justify-content: space-between; gap: var(--space-2); cursor: pointer; user-select: none; }
  .ui-select-native { position: absolute; inset: 0; opacity: 0; pointer-events: none; }
  .ui-select-label { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .ui-select.is-empty .ui-select-label { color: var(--color-text-tertiary); }
  .ui-select-chevron { flex: none; color: var(--color-text-tertiary); transition: transform 0.15s ease; }
  .ui-select.is-open .ui-select-chevron { transform: rotate(180deg); }
  .ui-select.is-open { border-color: var(--color-accent); }
  .ui-select-menu { position: fixed; width: max-content; max-width: 320px; background: var(--color-card); border: 1px solid var(--color-border-light); border-radius: var(--radius-md); box-shadow: var(--shadow-card); padding: var(--space-2); z-index: 1000; max-height: 240px; overflow-y: auto; display: flex; flex-direction: column; gap: 2px; }
  .ui-select-option { padding: var(--space-2) var(--space-3); border-radius: var(--radius-sm); color: var(--color-text-primary); cursor: pointer; white-space: nowrap; }
  .ui-select-option:hover { background: var(--color-border-lighter); }
  .ui-select-option.is-selected { background: var(--color-accent-tint-bg); color: var(--color-accent-tint-text); font-weight: 600; }

  /* ---- custom date picker (replaces native <input type="date"> popup) ---- */
  .ui-date { position: relative; display: inline-flex; align-items: center; justify-content: space-between; gap: var(--space-2); cursor: pointer; user-select: none; }
  .ui-date-native { position: absolute; inset: 0; opacity: 0; pointer-events: none; }
  .ui-date-label { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .ui-date.is-empty .ui-date-label { color: var(--color-text-tertiary); }
  .ui-date-icon { flex: none; color: var(--color-text-tertiary); }
  .ui-date.is-open { border-color: var(--color-accent); }
  .ui-date.is-open .ui-date-icon { color: var(--color-accent); }
  .ui-date-panel { position: fixed; width: 264px; background: var(--color-card); border: 1px solid var(--color-border-light); border-radius: var(--radius-md); box-shadow: var(--shadow-card); padding: var(--space-3); z-index: 1000; }
  .ui-date-panel-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: var(--space-2); }
  .ui-date-panel-title { font-size: var(--fs-small); font-weight: 700; color: var(--color-text-primary); }
  .ui-date-nav-btn { width: 26px; height: 26px; flex: none; display: flex; align-items: center; justify-content: center; border: none; background: transparent; border-radius: var(--radius-sm); color: var(--color-text-secondary); cursor: pointer; }
  .ui-date-nav-btn:hover { background: var(--color-border-lighter); color: var(--color-text-primary); }
  .ui-date-weekdays { display: grid; grid-template-columns: repeat(7, 1fr); gap: 2px; margin-bottom: 4px; }
  .ui-date-weekday { text-align: center; font-size: 11px; font-weight: 700; color: var(--color-text-tertiary); padding: 4px 0; }
  .ui-date-days { display: grid; grid-template-columns: repeat(7, 1fr); gap: 2px; }
  .ui-date-day { height: 30px; display: flex; align-items: center; justify-content: center; border: none; background: transparent; border-radius: var(--radius-sm); font-size: var(--fs-small); color: var(--color-text-primary); cursor: pointer; }
  .ui-date-day:hover { background: var(--color-border-lighter); }
  .ui-date-day.is-muted { color: var(--color-text-tertiary); opacity: 0.55; cursor: default; }
  .ui-date-day.is-muted:hover { background: transparent; }
  .ui-date-day.is-today { box-shadow: inset 0 0 0 1.5px var(--color-accent); font-weight: 700; }
  .ui-date-day.is-selected { background: var(--color-accent); color: #ffffff; font-weight: 700; }
  .ui-date-panel-footer { display: flex; justify-content: flex-end; margin-top: var(--space-2); padding-top: var(--space-2); border-top: 1px solid var(--color-border-lighter); }
  .ui-date-clear-btn { background: transparent; border: none; color: var(--color-text-secondary); font-size: var(--fs-small); font-weight: 600; padding: var(--space-1) var(--space-2); border-radius: var(--radius-sm); cursor: pointer; }
  .ui-date-clear-btn:hover { background: var(--color-border-lighter); color: var(--color-text-primary); }

  .field-with-icon { position: relative; display: flex; align-items: center; }
  .search-input { width: 220px; height: 40px; padding: 0 var(--space-3) 0 40px; border: 1px solid var(--color-border); border-radius: var(--radius-md); font-size: var(--fs-body); color: var(--color-text-primary); background: var(--color-card); }
  .search-input::placeholder { color: var(--color-text-tertiary); }
  .field-with-icon .field-icon { position: absolute; left: var(--space-3); color: var(--color-text-tertiary); display: flex; }
  .records-per-page { display: flex; align-items: center; gap: var(--space-2); }
  .records-per-page-label { font-size: var(--fs-small); color: var(--color-text-secondary); white-space: nowrap; }

  /* ---- multiselect / chips (shared by Create Competency Group + Create Role) ---- */
  .multiselect { position: relative; }
  .multiselect-trigger { width: 100%; display: flex; align-items: center; justify-content: space-between; padding: var(--space-3); border: 1px solid var(--color-border); border-radius: var(--radius-md); background: var(--color-card); font-size: var(--fs-body); color: var(--color-text-primary); }
  .multiselect-trigger svg { color: var(--color-text-tertiary); flex: none; transition: transform 0.15s ease; }
  .multiselect.is-open .multiselect-trigger svg { transform: rotate(180deg); }
  .multiselect-menu { position: absolute; left: 0; right: 0; top: calc(100% + 6px); background: var(--color-card); border: 1px solid var(--color-border-light); border-radius: var(--radius-md); box-shadow: var(--shadow-card); padding: var(--space-2); z-index: 10; display: none; flex-direction: column; gap: 2px; }
  .multiselect.is-open .multiselect-menu { display: flex; }
  .multiselect-option { display: flex; align-items: center; gap: var(--space-2); padding: var(--space-2); border-radius: var(--radius-sm); font-size: var(--fs-body); }
  .multiselect-option:hover { background: var(--color-border-lighter); }
  .multiselect-checkbox { width: 16px; height: 16px; flex: none; border: 1.5px solid var(--color-border); border-radius: 4px; display: flex; align-items: center; justify-content: center; background: var(--color-card); color: #ffffff; }
  .multiselect-checkbox svg { display: none; }
  .multiselect-checkbox.is-checked { background: var(--color-accent); border-color: var(--color-accent); }
  .multiselect-checkbox.is-checked svg { display: block; }

  .row-checkbox { width: 18px; height: 18px; flex: none; border: 1.5px solid var(--color-border); border-radius: 5px; display: flex; align-items: center; justify-content: center; background: var(--color-card); color: #ffffff; }
  .row-checkbox svg { display: none; }
  .row-checkbox.is-checked { background: var(--color-accent); border-color: var(--color-accent); }
  .row-checkbox.is-checked svg { display: block; }

  .chip-row { display: flex; flex-wrap: wrap; gap: var(--space-2); }
  .chip-removable { display: inline-flex; align-items: center; gap: 2px; padding: 4px 4px 4px var(--space-3); border-radius: var(--radius-pill); background: #f2f5fa; color: #1d4ed8; font-size: var(--fs-body); font-weight: 500; }
  .chip-remove-btn { width: 24px; height: 24px; display: flex; align-items: center; justify-content: center; border: none; background: transparent; color: inherit; border-radius: 50%; }
  .chip-remove-btn:hover { background: rgba(29, 78, 216, 0.15); }

  /* ---- two-column form layout (Create Competency Group + Create Role) ---- */
  .form-columns { display: grid; grid-template-columns: 1fr 1.75fr; gap: var(--space-5); align-items: stretch; }
  .panel { background: var(--color-card); border: 1px solid #f2f5fa; border-radius: var(--radius-lg); padding: var(--space-5); display: flex; flex-direction: column; gap: var(--space-5); min-height: 0; }
  .panel-header { display: flex; align-items: center; justify-content: space-between; gap: var(--space-3); }
  .panel-header-left { display: flex; align-items: center; gap: var(--space-2); }
  .label-accent { font-size: var(--fs-label); font-weight: 700; letter-spacing: 0.06em; color: var(--color-accent); }
  .count-badge { display: inline-flex; align-items: center; justify-content: center; min-width: 22px; height: 22px; padding: 0 var(--space-2); border-radius: var(--radius-pill); background: #f2f5fa; color: var(--color-neutral-tint-text); font-size: 12px; font-weight: 500; }
  .btn-add-trigger { display: inline-flex; align-items: center; gap: var(--space-2); height: 36px; padding: 0 var(--space-4); border-radius: var(--radius-md); border: 1px solid var(--color-border); background: var(--color-card); color: var(--color-accent); font-size: var(--fs-small); font-weight: 600; }
  .btn-add-trigger:hover { background: var(--color-accent-tint-bg); }
  .btn-add-trigger svg { flex: none; }

  /* ---- bottom action bar (shell-level, shown for Competency Group create-view + Role) ---- */
  .action-bar-wrap { flex: none; padding: 0 var(--space-4) var(--space-5); background: var(--color-bg); }
  .action-bar-wrap:has(#action-bar[hidden]) { display: none; }
  .action-bar { display: flex; align-items: center; justify-content: space-between; gap: var(--space-4); padding: var(--space-3); background: var(--color-card); border-radius: var(--radius-lg); box-shadow: var(--shadow-card); }
  .action-bar[hidden] { display: none; }
  .action-bar-status { display: flex; align-items: center; gap: var(--space-2); font-size: var(--fs-small); color: var(--color-text-secondary); }
  .status-icon { width: 18px; height: 18px; flex: none; display: flex; align-items: center; justify-content: center; border-radius: var(--radius-pill); }
  .status-icon.is-complete { background: #dcfce7; color: #16a34a; }
  .status-icon.is-incomplete { background: #fef3c7; color: #b45309; }
  .action-bar-buttons { display: flex; align-items: center; gap: var(--space-5); }

  /* ---- pagination ---- */
  .pagination-summary { font-size: var(--fs-small); color: var(--color-text-secondary); }
  .pagination-controls { display: flex; align-items: center; gap: var(--space-2); }
  .page-btn { min-width: 36px; height: 36px; padding: 0 var(--space-2); display: inline-flex; align-items: center; justify-content: center; gap: var(--space-1); border: 1px solid var(--color-border); border-radius: var(--radius-md); background: var(--color-card); color: var(--color-text-primary); font-size: var(--fs-small); font-weight: 600; }
  .page-btn.is-active { background: var(--color-accent); border-color: var(--color-accent); color: #ffffff; }
  .page-btn.is-disabled { color: var(--color-text-tertiary); cursor: not-allowed; }
  .page-btn-nav { padding: 0 var(--space-3); }

  /* ============================================================
     Page-specific: Dashboard
  ============================================================ */
  .btn-filter-toggle { display: inline-flex; align-items: center; gap: var(--space-2); height: 36px; padding: 0 var(--space-3); border-radius: var(--radius-md); border: 1px solid var(--color-border); background: var(--color-card); color: var(--color-text-secondary); font-size: var(--fs-small); font-weight: 600; }

  .drawer-scrim { position: absolute; inset: 0; background: var(--color-scrim); border-radius: inherit; z-index: 5; }
  .competency-drawer[hidden], .drawer-scrim[hidden] { display: none; }
  .competency-drawer { position: absolute; left: 0; right: 0; top: 128px; bottom: 0; min-height: 490px; z-index: 6; display: flex; flex-direction: column; gap: var(--space-5); background: var(--color-card); border-radius: var(--radius-lg) var(--radius-lg) 0 0; box-shadow: var(--shadow-drawer); padding: var(--space-5) var(--space-6) var(--space-6); overflow-y: auto; }
  .drawer-header { display: flex; align-items: center; justify-content: space-between; gap: var(--space-3); }
  .drawer-header-left { display: flex; align-items: center; gap: var(--space-3); }
  .add-icon-btn { width: 28px; height: 28px; flex: none; display: flex; align-items: center; justify-content: center; background: var(--color-accent); color: #ffffff; border: none; border-radius: var(--radius-sm); }
  .drawer-title { font-size: var(--fs-body); font-weight: 700; color: var(--color-text-primary); }
  .synced-row { display: flex; align-items: center; flex-wrap: wrap; gap: var(--space-2); padding: var(--space-3); border: 1px solid #f2f5fa; border-radius: var(--radius-md); background: var(--color-bg); font-size: var(--fs-small); color: var(--color-text-secondary); }
  .synced-row svg { flex: none; color: var(--color-text-tertiary); }
  .sync-chip { display: inline-flex; align-items: center; gap: var(--space-1); font-size: var(--fs-small); font-weight: 600; color: var(--color-accent); }
  .form-grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: var(--space-4); }
  .form-actions { display: flex; align-items: center; gap: var(--space-3); }

  /* ============================================================
     Page-specific: Create Role
  ============================================================ */
  .competency-scroll { flex: 1; min-height: 0; overflow-y: auto; display: flex; flex-direction: column; gap: var(--space-4); padding-right: var(--space-2); }
  .competency-scroll::-webkit-scrollbar { width: 6px; }
  .competency-scroll::-webkit-scrollbar-track { background: transparent; }
  .competency-scroll::-webkit-scrollbar-thumb { background: #ededed; border-radius: var(--radius-pill); }
  .competency-scroll::-webkit-scrollbar-thumb:hover { background: #d9d9d9; }
  .group-section { display: flex; flex-direction: column; flex-shrink: 0; border: 1px solid #f2f5fa; border-radius: var(--radius-md); overflow: hidden; }
  .group-header-bar { display: flex; align-items: center; justify-content: space-between; padding: var(--space-3) var(--space-4); background: var(--color-bg); }
  .group-header-name { font-size: var(--fs-body); font-weight: 600; }
  .group-header-count { font-size: var(--fs-small); color: var(--color-text-tertiary); }
  .group-rows { max-height: 182px; flex-shrink: 0; overflow-y: auto; }
  .group-rows::-webkit-scrollbar { width: 6px; }
  .group-rows::-webkit-scrollbar-track { background: transparent; }
  .group-rows::-webkit-scrollbar-thumb { background: #ededed; border-radius: var(--radius-pill); }
  .group-rows::-webkit-scrollbar-thumb:hover { background: #d9d9d9; }
  .competency-row { display: flex; align-items: center; gap: var(--space-3); padding: var(--space-3) var(--space-4); border-bottom: 1px solid #f2f5fa; }
  .competency-row:last-child { border-bottom: none; }
  .competency-name-cell { display: flex; align-items: baseline; gap: var(--space-1); flex: 1; min-width: 0; }
  .competency-name-text { font-weight: 500; font-size: var(--fs-body); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .competency-id-text { font-size: var(--fs-small); color: var(--color-text-tertiary); white-space: nowrap; }
  .competency-level-select { width: 168px; flex: none; height: 36px; padding: 0 var(--space-3); border: 1px solid var(--color-border); border-radius: var(--radius-md); background: var(--color-card); color: var(--color-text-primary); font-size: var(--fs-small); }

  /* ============================================================
     Page-specific: Role Mapping
  ============================================================ */
  .mapping-create-panel { border: 1.5px dashed var(--color-accent); background: var(--color-accent-tint-bg); border-radius: var(--radius-lg); padding: var(--space-3) var(--space-4); display: flex; flex-direction: column; gap: var(--space-3); }
  .mapping-create-panel:has(.mapping-create-body[hidden]) { cursor: pointer; }
  .mapping-create-header { display: flex; align-items: center; justify-content: space-between; gap: var(--space-3); }
  .mapping-collapse-btn svg { transition: transform 0.15s ease; }
  .mapping-collapse-btn.is-collapsed svg { transform: rotate(180deg); }
  .mapping-create-header-left { display: flex; align-items: baseline; gap: var(--space-3); }
  .mapping-create-title { font-size: var(--fs-body); font-weight: 700; color: var(--color-text-primary); }
  .mapping-create-subtitle { font-size: var(--fs-small); color: var(--color-text-tertiary); }
  .mapping-create-body { display: flex; gap: var(--space-6); align-items: flex-start; }
  .mapping-create-body[hidden] { display: none; }
  .mapping-create-main { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: var(--space-4); }
  .mapping-assessor-rows { display: flex; flex-direction: column; gap: var(--space-3); }
  .mapping-assessor-row { display: flex; align-items: center; gap: var(--space-4); background: var(--color-card); border: 1px solid var(--color-border-light); border-radius: var(--radius-md); padding: var(--space-3) var(--space-4); }
  .mapping-assessor-row .select-input { max-width: 260px; }
  .mapping-mandatory-label { font-size: var(--fs-body); color: var(--color-text-primary); }
  .mapping-assessor-row .icon-btn-plain { margin-left: auto; }
  .mapping-add-role-btn { display: inline-flex; align-items: center; gap: var(--space-2); align-self: flex-start; background: transparent; border: none; color: var(--color-accent); font-size: var(--fs-small); font-weight: 600; padding: 0; cursor: pointer; }
  .mapping-add-role-btn:hover { text-decoration: underline; }
  .mapping-create-actions { display: flex; align-items: center; gap: var(--space-3); }
  .mapping-summary { width: 190px; flex: none; display: flex; flex-direction: column; gap: var(--space-2); padding-left: var(--space-5); border-left: 1px solid var(--color-border-light); }
  .mapping-summary-title { font-size: var(--fs-small); font-weight: 700; color: var(--color-text-primary); }
  .mapping-summary-counts { font-size: var(--fs-body); font-weight: 600; color: var(--color-text-primary); }
  .mapping-summary-caption { font-size: var(--fs-small); color: var(--color-text-tertiary); }

  .toggle-switch { position: relative; display: inline-flex; align-items: center; width: 40px; height: 22px; flex: none; border-radius: var(--radius-pill); background: var(--color-border); cursor: pointer; transition: background 0.15s ease; }
  .toggle-switch.is-on { background: var(--color-accent); }
  .toggle-knob { position: absolute; top: 2px; left: 2px; width: 18px; height: 18px; border-radius: 50%; background: #ffffff; box-shadow: 0 1px 2px rgba(18, 35, 61, 0.2); transition: transform 0.15s ease; }
  .toggle-switch.is-on .toggle-knob { transform: translateX(18px); }

  .mapping-list-scroll { flex: 1; min-height: 0; overflow-y: auto; display: flex; flex-direction: column; gap: 16px; padding-right: 14px; margin-right: -14px; }
  .mapping-list-scroll::-webkit-scrollbar { width: 6px; }
  .mapping-list-scroll::-webkit-scrollbar-track { background: transparent; }
  .mapping-list-scroll::-webkit-scrollbar-thumb { background: #ededed; border-radius: 20px; }
  .mapping-list { display: flex; flex-direction: column; gap: var(--space-3); margin-top: var(--space-2); }
  .mapping-list-item { display: flex; align-items: center; gap: 64px; padding: var(--space-2) var(--space-4); border: 1px solid var(--color-border-light); border-radius: var(--radius-lg); }
  .mapping-list-item-left { display: flex; align-items: center; gap: var(--space-3); flex: none; width: 190px; }
  .mapping-role-name { font-size: var(--fs-body); font-weight: 700; color: var(--color-text-primary); }
  .mapping-list-item-right { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: var(--space-2); }
  .mapping-tagged-caption { font-size: var(--fs-small); color: var(--color-text-tertiary); }
  .mapping-expand-btn svg { transition: transform 0.15s ease; }
  .mapping-list-item[data-expanded="true"] .mapping-expand-btn svg { transform: rotate(180deg); }
</style>
</head>

/* ============================================================
   Custom select — replaces every native <select> popup with an
   app-styled trigger + menu. The original <select> stays in the
   DOM (hidden) as the source of truth, so existing 'change'
   listeners and .value reads keep working untouched.
============================================================ */
function closeAllUiSelectMenus() {
  document.querySelectorAll('.ui-select.is-open').forEach(function (el) { el.classList.remove('is-open'); });
  document.querySelectorAll('.ui-select-menu').forEach(function (m) { m.remove(); });
}

function enhanceSelect(selectEl) {
  if (selectEl.dataset.uiEnhanced) return;
  selectEl.dataset.uiEnhanced = '1';

  var wrap = document.createElement('span');
  wrap.className = 'ui-select ' + selectEl.className;
  selectEl.parentNode.insertBefore(wrap, selectEl);
  selectEl.classList.add('ui-select-native');
  selectEl.tabIndex = -1;
  wrap.appendChild(selectEl);

  var label = document.createElement('span');
  label.className = 'ui-select-label';
  wrap.appendChild(label);
  wrap.insertAdjacentHTML('beforeend', '<svg class="ui-select-chevron" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>');

  var menu = null;

  function syncLabel() {
    var opt = selectEl.options[selectEl.selectedIndex];
    label.textContent = opt ? opt.textContent : '';
    wrap.classList.toggle('is-empty', !selectEl.value);
  }
  function closeMenu() {
    wrap.classList.remove('is-open');
    if (menu) { menu.remove(); menu = null; }
    window.removeEventListener('scroll', closeMenu, true);
    window.removeEventListener('resize', closeMenu);
  }
  function openMenu() {
    closeAllUiSelectMenus();
    closeAllUiDatePanels();
    var r = wrap.getBoundingClientRect();
    menu = document.createElement('div');
    menu.className = 'ui-select-menu';
    menu.style.left = r.left + 'px';
    menu.style.top = (r.bottom + 6) + 'px';
    menu.style.minWidth = r.width + 'px';
    Array.prototype.forEach.call(selectEl.options, function (opt, idx) {
      var item = document.createElement('div');
      item.className = 'ui-select-option' + (idx === selectEl.selectedIndex ? ' is-selected' : '');
      item.textContent = opt.textContent;
      item.addEventListener('click', function (e) {
        e.stopPropagation();
        if (selectEl.selectedIndex !== idx) {
          selectEl.selectedIndex = idx;
          selectEl.dispatchEvent(new Event('change', { bubbles: true }));
        }
        syncLabel();
        closeMenu();
      });
      menu.appendChild(item);
    });
    document.body.appendChild(menu);
    wrap.classList.add('is-open');
    window.addEventListener('scroll', closeMenu, true);
    window.addEventListener('resize', closeMenu);
  }
  wrap.addEventListener('click', function (e) {
    if (selectEl.disabled) return;
    e.stopPropagation();
    if (wrap.classList.contains('is-open')) closeMenu(); else openMenu();
  });

  syncLabel();
}

function enhanceSelects(root) {
  (root || document).querySelectorAll('select').forEach(enhanceSelect);
}

function enhanceDateInput(dateEl) {
  if (dateEl.dataset.uiDateEnhanced) return;
  dateEl.dataset.uiDateEnhanced = '1';

  var wrap = document.createElement('span');
  wrap.className = 'ui-date ' + dateEl.className;
  dateEl.parentNode.insertBefore(wrap, dateEl);
  dateEl.classList.add('ui-date-native');
  dateEl.tabIndex = -1;
  wrap.appendChild(dateEl);

  var label = document.createElement('span');
  label.className = 'ui-date-label';
  wrap.appendChild(label);
  wrap.insertAdjacentHTML('beforeend', '<svg class="ui-date-icon" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="2"/><line x1="3" y1="10" x2="21" y2="10"/><line x1="8" y1="3" x2="8" y2="7"/><line x1="16" y1="3" x2="16" y2="7"/></svg>');

  var panel = null;
  var viewYear, viewMonth;

  function pad(n) { return n < 10 ? '0' + n : '' + n; }
  function fmt(y, m, d) { return y + '-' + pad(m + 1) + '-' + pad(d); }
  function parseVal() {
    if (!dateEl.value) return null;
    var parts = dateEl.value.split('-');
    return { y: +parts[0], m: +parts[1] - 1, d: +parts[2] };
  }
  function syncLabel() {
    var v = parseVal();
    if (v) {
      label.textContent = pad(v.m + 1) + '/' + pad(v.d) + '/' + v.y;
      wrap.classList.remove('is-empty');
    } else {
      label.textContent = 'mm/dd/yyyy';
      wrap.classList.add('is-empty');
    }
  }
  function closePanel() {
    wrap.classList.remove('is-open');
    if (panel) { panel.remove(); panel = null; }
    window.removeEventListener('scroll', closePanel, true);
    window.removeEventListener('resize', closePanel);
  }
  function setValue(y, m, d) {
    dateEl.value = fmt(y, m, d);
    dateEl.dispatchEvent(new Event('input', { bubbles: true }));
    dateEl.dispatchEvent(new Event('change', { bubbles: true }));
    syncLabel();
    closePanel();
  }
  function renderPanel() {
    var today = new Date();
    var first = new Date(viewYear, viewMonth, 1);
    var startWeekday = first.getDay();
    var daysInMonth = new Date(viewYear, viewMonth + 1, 0).getDate();
    var daysInPrevMonth = new Date(viewYear, viewMonth, 0).getDate();
    var v = parseVal();

    var cells = '';
    for (var i = 0; i < startWeekday; i++) {
      cells += '<button type="button" class="ui-date-day is-muted" disabled>' + (daysInPrevMonth - startWeekday + 1 + i) + '</button>';
    }
    for (var d = 1; d <= daysInMonth; d++) {
      var isToday = today.getFullYear() === viewYear && today.getMonth() === viewMonth && today.getDate() === d;
      var isSelected = v && v.y === viewYear && v.m === viewMonth && v.d === d;
      cells += '<button type="button" class="ui-date-day' + (isToday ? ' is-today' : '') + (isSelected ? ' is-selected' : '') + '" data-day="' + d + '">' + d + '</button>';
    }
    var trailing = (7 - ((startWeekday + daysInMonth) % 7)) % 7;
    for (var t = 1; t <= trailing; t++) {
      cells += '<button type="button" class="ui-date-day is-muted" disabled>' + t + '</button>';
    }

    panel.innerHTML =
      '<div class="ui-date-panel-header">' +
      '<button type="button" class="ui-date-nav-btn" data-nav="-1" aria-label="Previous month"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg></button>' +
      '<span class="ui-date-panel-title">' + MONTH_NAMES[viewMonth] + ' ' + viewYear + '</span>' +
      '<button type="button" class="ui-date-nav-btn" data-nav="1" aria-label="Next month"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg></button>' +
      '</div>' +
      '<div class="ui-date-weekdays">' + WEEKDAY_NAMES.map(function (w) { return '<span class="ui-date-weekday">' + w + '</span>'; }).join('') + '</div>' +
      '<div class="ui-date-days">' + cells + '</div>' +
      '<div class="ui-date-panel-footer"><button type="button" class="ui-date-clear-btn" data-clear="1">Clear</button></div>';

    panel.querySelector('[data-nav="-1"]').addEventListener('click', function (e) {
      e.stopPropagation();
      viewMonth--; if (viewMonth < 0) { viewMonth = 11; viewYear--; }
      renderPanel();
    });
    panel.querySelector('[data-nav="1"]').addEventListener('click', function (e) {
      e.stopPropagation();
      viewMonth++; if (viewMonth > 11) { viewMonth = 0; viewYear++; }
      renderPanel();
    });
    panel.querySelectorAll('.ui-date-day[data-day]').forEach(function (btn) {
      btn.addEventListener('click', function (e) {
        e.stopPropagation();
        setValue(viewYear, viewMonth, +btn.getAttribute('data-day'));
      });
    });
    panel.querySelector('[data-clear]').addEventListener('click', function (e) {
      e.stopPropagation();
      dateEl.value = '';
      dateEl.dispatchEvent(new Event('input', { bubbles: true }));
      dateEl.dispatchEvent(new Event('change', { bubbles: true }));
      syncLabel();
      closePanel();
    });
  }
  function openPanel() {
    closeAllUiSelectMenus();
    closeAllUiDatePanels();
    var v = parseVal();
    var today = new Date();
    viewYear = v ? v.y : today.getFullYear();
    viewMonth = v ? v.m : today.getMonth();
    var r = wrap.getBoundingClientRect();
    panel = document.createElement('div');
    panel.className = 'ui-date-panel';
    panel.style.left = r.left + 'px';
    panel.style.top = (r.bottom + 6) + 'px';
    document.body.appendChild(panel);
    renderPanel();
    wrap.classList.add('is-open');
    window.addEventListener('scroll', closePanel, true);
    window.addEventListener('resize', closePanel);
  }

  wrap.addEventListener('click', function (e) {
    e.stopPropagation();
    if (wrap.classList.contains('is-open')) closePanel(); else openPanel();
  });

  syncLabel();
}

function enhanceDateInputs(root) {
  (root || document).querySelectorAll('input[type="date"]').forEach(enhanceDateInput);
}

document.addEventListener('click', function () { closeAllUiSelectMenus(); closeAllUiDatePanels(); });

function renderApp() {
  saveNavState();
  closeAllUiSelectMenus();
  closeAllUiDatePanels();
  renderSidebar();
  var actionBar = document.getElementById('action-bar');
  actionBar.hidden = true;
  actionBar.innerHTML = '';

  if (activePage === 'competency-group') {
    updateBreadcrumb(groupView === 'list' ? '/Competency Group' : '/Competency Group/Create Competency Group');
    document.getElementById('page-root').innerHTML = groupView === 'list' ? PAGE_HTML['group-list'] : PAGE_HTML['group-create'];
    if (groupView === 'list') PAGE_INIT['group-list'](); else PAGE_INIT['group-create']();
    enhanceSelects(document.getElementById('page-root'));
    enhanceDateInputs(document.getElementById('page-root'));
    return;
  }
  if (activePage === 'role') {
    updateBreadcrumb(roleView === 'list' ? '/Role' : '/Role/Create Role');
    document.getElementById('page-root').innerHTML = roleView === 'list' ? PAGE_HTML['role-list'] : PAGE_HTML.role;
    if (roleView === 'list') PAGE_INIT['role-list'](); else PAGE_INIT.role();
    enhanceSelects(document.getElementById('page-root'));
    enhanceDateInputs(document.getElementById('page-root'));
    return;
  }
  updateBreadcrumb(PAGES_META[activePage].breadcrumb);
  document.getElementById('page-root').innerHTML = PAGE_HTML[activePage];
  PAGE_INIT[activePage]();
  enhanceSelects(document.getElementById('page-root'));
  enhanceDateInputs(document.getElementById('page-root'));
}

document.addEventListener('click', function (e) {
  var navItem = e.target.closest('.nav-item');
  if (!navItem) return;
  e.preventDefault();
  var page = navItem.getAttribute('data-page');
  if (!page) return;
  activePage = page;
  if (activePage === 'competency-group') groupView = 'list';
  if (activePage === 'role') roleView = 'list';
  renderApp();
});

PAGE_INIT.dashboard = function () {
  /* ============================================================
     Deterministic dataset
  ============================================================ */
  function mulberry32(seed) {
    return function () {
      seed |= 0; seed = (seed + 0x6D2B79F5) | 0;
      var t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  var rng = mulberry32(1234);

  var LEVELS = ['Foundation', 'Proficient', 'Advance'];
  var LEVEL_WEIGHT = { Foundation: 1, Proficient: 2, Advance: 3 };
  var GROUP_COMPETENCIES = {
    'Sales Acumen': ['Account Management', 'Business Development'],
    'Product Knowledge': ['Product Positioning', 'Technical Fluency'],
    'Soft Skills': ['Communication Skills', 'Problem Solving', 'Teamwork'],
    'Technical Skills': ['System Design', 'Code Quality']
  };
  var GROUP_NAMES = Object.keys(GROUP_COMPETENCIES);
  var ALL_COMPETENCIES = GROUP_NAMES.reduce(function (arr, g) { return arr.concat(GROUP_COMPETENCIES[g]); }, []);
  var BENCHMARK = {
    'Account Management': 2.5, 'Business Development': 2.0,
    'Product Positioning': 2.0, 'Technical Fluency': 1.5,
    'Communication Skills': 2.0, 'Problem Solving': 2.2, 'Teamwork': 1.8,
    'System Design': 2.5, 'Code Quality': 2.3
  };
  var ROLE_GROUPS = {
    'CAT Developer': ['Technical Skills', 'Soft Skills'],
    'Tester': ['Technical Skills', 'Soft Skills'],
    'P-MD': ['Sales Acumen', 'Soft Skills'],
    'Manual Tester': ['Technical Skills', 'Product Knowledge']
  };
  var ROLES = Object.keys(ROLE_GROUPS);
  var ASSESSORS = [
    { uid: 'RB001', name: 'Rahul Bhure' }, { uid: 'SK002', name: 'Sanjay Kulkarni' },
    { uid: 'PM003', name: 'Priya Menon' }, { uid: 'AK004', name: 'Arjun Kapoor' }, { uid: 'NV005', name: 'Neha Verma' }
  ];
  var FIRST_NAMES = ['Craig', 'Baljeet', 'Amit', 'Ankush', 'Kunjal', 'Latha', 'Shuchi', 'Uday', 'Meera', 'Vikram', 'Farah', 'Ishaan', 'Divya', 'Rohit', 'Ananya', 'Karan', 'Simran', 'Aditya', 'Priyanka', 'Manish', 'Ritu', 'Naveen', 'Sneha', 'Gaurav', 'Kavita', 'Deepak', 'Nisha', 'Rajat', 'Pooja', 'Vivek'];
  var LAST_NAMES = ['Allies', 'Kumar', 'Kapoor', 'Kamra', 'Modi', 'Raut', 'Bharadwaj', 'Alhat', 'Shah', 'Nair', 'Sheikh', 'Roy', 'Pillai', 'Sinha', 'Iyer', 'Malhotra', 'Kaur', 'Rao', 'Das', 'Gupta', 'Chawla', 'Reddy', 'Joshi', 'Bhatt', 'Pawar', 'Chandra', 'Verma', 'Mehta', 'Bose', 'Menon'];
  var SURVEYS = [
    { id: 'SI001', role: 'CAT Developer' }, { id: 'SI002', role: 'Tester' },
    { id: 'SI003', role: 'P-MD' }, { id: 'SI004', role: 'Manual Tester' },
    { id: 'SI005', role: 'CAT Developer' }, { id: 'SI006', role: 'Tester' }
  ];
  var MONTH_LABELS = ['Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep'];

  /* Per-competency capability profile (0 = weak, 1 = strong). Real orgs are
     uneven — some competencies systematically lag their benchmark and some
     clear it comfortably. Without this every competency averages the same and
     every band chart comes out solid green. */
  var COMPETENCY_STRENGTH = {
    'Account Management': 0.35,
    'Business Development': 0.75,
    'Product Positioning': 0.55,
    'Technical Fluency': 0.85,
    'Communication Skills': 0.70,
    'Problem Solving': 0.40,
    'Teamwork': 0.80,
    'System Design': 0.28,
    'Code Quality': 0.60
  };

  function pickLevel(competency) {
    var s = COMPETENCY_STRENGTH[competency];
    if (s === undefined) s = 0.6;
    var pFoundation = (1 - s) * 0.6;
    var pAdvance = s * 0.55;
    var r = rng();
    if (r < pFoundation) return 'Foundation';
    if (r < pFoundation + pAdvance) return 'Advance';
    return 'Proficient';
  }

  var ASSESSEES = [];
  (function () {
    for (var i = 0; i < 30; i++) {
      var first = FIRST_NAMES[i % FIRST_NAMES.length];
      var last = LAST_NAMES[(i + 7) % LAST_NAMES.length];
      var role = ROLES[i % ROLES.length];
      var uid = (first.slice(0, 2) + last.slice(0, 2)).toUpperCase() + (100 + i);

  })();

          var level = pickLevel(c);
          FACTS.push({
            assesseeUid: a.uid, assesseeName: a.name, role: a.role,
            assessorUid: assessor.uid, assessorName: assessor.name,
            surveyId: survey.id, group: g, competency: c,
            level: level, weight: LEVEL_WEIGHT[level], benchmark: BENCHMARK[c], month: monthIdx
          });
        });
      });
    });
  })();

  /* ============================================================
     Filters
  ============================================================ */
  var filters = { search: '', role: '', group: '', start: '', end: '' };

  function uniqueVals(arr, key) {
    var seen = {}, out = [];
    arr.forEach(function (x) { if (!seen[x[key]]) { seen[x[key]] = true; out.push(x[key]); } });
    return out;
  }
  function monthToDate(m) { return new Date(2026, 3 + m, 15); }

  function applyFilters() {
    var q = filters.search.trim().toLowerCase();
    return FACTS.filter(function (f) {
      if (q && f.assesseeName.toLowerCase().indexOf(q) === -1 && f.assesseeUid.toLowerCase().indexOf(q) === -1) return false;
      if (filters.role && f.role !== filters.role) return false;
      if (filters.group && f.group !== filters.group) return false;
      if (filters.start && monthToDate(f.month) < new Date(filters.start)) return false;
      if (filters.end && monthToDate(f.month) > new Date(filters.end)) return false;
      return true;
    });
  }

  document.getElementById('role-filter').innerHTML += ROLES.map(function (r) { return '<option value="' + r + '">' + r + '</option>'; }).join('');
  document.getElementById('group-filter').innerHTML += GROUP_NAMES.map(function (g) { return '<option value="' + g + '">' + g + '</option>'; }).join('');

  ['search-input', 'role-filter', 'group-filter', 'start-filter', 'end-filter'].forEach(function (id) {
    var el = document.getElementById(id);
    var key = id === 'search-input' ? 'search' : id === 'role-filter' ? 'role' : id === 'group-filter' ? 'group' : id === 'start-filter' ? 'start' : 'end';
    var evt = (el.tagName === 'INPUT' && el.type === 'text') ? 'input' : 'change';
    el.addEventListener(evt, function () { filters[key] = el.value; renderAll(); });
  });

  /* ---- hide/show filters ---- */
  var filtersVisible = true;
  document.getElementById('filter-toggle-btn').addEventListener('click', function () {
    filtersVisible = !filtersVisible;
    document.getElementById('filters-row').hidden = !filtersVisible;
    this.classList.toggle('is-collapsed', !filtersVisible);
    document.getElementById('filter-toggle-text').textContent = filtersVisible ? 'Hide filters' : 'Show filters';
  });

  function activeFilterCount() {
    return Object.keys(filters).filter(function (k) { return !!filters[k]; }).length;
  }

  /* ============================================================
     Shared helpers
  ============================================================ */
  function bandOf(score, benchmark) {
    if (!benchmark) return 'good';
    var ratio = score / benchmark;
    if (ratio >= 0.85) return 'good';
    if (ratio >= 0.70) return 'warning';
    return 'critical';
  }
  var BAND_COLOR = { good: 'var(--viz-good)', warning: 'var(--viz-warning)', critical: 'var(--viz-critical)' };
  var BAND_BG = { good: 'var(--viz-good-bg)', warning: 'var(--viz-warning-bg)', critical: 'var(--viz-critical-bg)' };
  var BAND_TEXT = { good: 'var(--viz-good-text)', warning: 'var(--viz-warning-text)', critical: 'var(--viz-critical-text)' };
  var BAND_LABEL = { good: '≥ 85% of benchmark', warning: '70–85% of benchmark', critical: '< 70% of benchmark' };
  function avg(arr) { return arr.length ? arr.reduce(function (s, v) { return s + v; }, 0) / arr.length : 0; }

  function hBarPath(x, y, w, h, r) {
    if (w <= 0) return '';
    r = Math.max(0, Math.min(r, w / 2, h / 2));
    return 'M' + x + ',' + y + ' L' + (x + w - r) + ',' + y + ' Q' + (x + w) + ',' + y + ' ' + (x + w) + ',' + (y + r) +
      ' L' + (x + w) + ',' + (y + h - r) + ' Q' + (x + w) + ',' + (y + h) + ' ' + (x + w - r) + ',' + (y + h) +
      ' L' + x + ',' + (y + h) + ' Z';
  }

  function sparkline(values, w, h) {
    if (values.length < 2) return '';
    var max = Math.max.apply(null, values.concat([0.01]));
    var stepX = w / (values.length - 1);
    var pts = values.map(function (v, i) { return [i * stepX, h - (v / max) * h]; });
    var path = pts.map(function (p, i) { return (i === 0 ? 'M' : 'L') + p[0].toFixed(1) + ',' + p[1].toFixed(1); }).join(' ');
    var last = pts[pts.length - 1];
    return '<svg width="' + w + '" height="' + h + '" viewBox="0 0 ' + w + ' ' + h + '">' +
      '<path d="' + path + '" fill="none" stroke="var(--viz-blue-500)" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" opacity="0.75"/>' +
      '<circle cx="' + last[0].toFixed(1) + '" cy="' + last[1].toFixed(1) + '" r="2.5" fill="var(--viz-blue-500)"/></svg>';
  }

  /* ============================================================
     Chart renderers
  ============================================================ */
  function renderPairBars(rows) {
    if (!rows.length) return '<div class="chart-empty">No data for the current filters.</div>';
    var labelW = 170, barH = 15, gap = 2, rowGap = 18, plotW = 780, pillW = 60;
    var maxScale = 3;
    var rowH = barH * 2 + gap + rowGap;
    var svgW = labelW + plotW + pillW + 60, svgH = rows.length * rowH + 8;
    var scaleX = function (v) { return (v / maxScale) * plotW; };
    var body = '';
    rows.forEach(function (r, i) {
      var y = i * rowH + 6;
      var aw = scaleX(r.score), bw = scaleX(r.benchmark);
      var delta = r.score - r.benchmark;
      if (Math.abs(delta) < 0.05) delta = 0;
      var deltaGood = delta >= 0;
      body += '<text x="0" y="' + (y + barH + gap / 2 + 4) + '" font-size="12" fill="var(--viz-ink-secondary)">' + r.label + '</text>';
      body += '<path d="' + hBarPath(labelW, y, aw, barH, 4) + '" fill="var(--viz-blue-500)"/>';
      body += '<text x="' + (labelW + aw + 6) + '" y="' + (y + barH - 2) + '" font-size="11" fill="var(--viz-ink-secondary)">' + r.score.toFixed(1) + '</text>';
      var y2 = y + barH + gap;
      body += '<path d="' + hBarPath(labelW, y2, bw, barH, 4) + '" fill="var(--viz-benchmark)"/>';
      body += '<text x="' + (labelW + bw + 6) + '" y="' + (y2 + barH - 2) + '" font-size="11" fill="var(--viz-ink-secondary)">' + r.benchmark.toFixed(1) + '</text>';
      var pillX = labelW + plotW + 20, pillY = y + (barH * 2 + gap) / 2 - 9;
      body += '<rect x="' + pillX + '" y="' + pillY + '" width="' + pillW + '" height="18" rx="9" fill="' + (deltaGood ? 'var(--viz-good-bg)' : 'var(--viz-critical-bg)') + '"/>';
      body += '<text x="' + (pillX + pillW / 2) + '" y="' + (pillY + 13) + '" font-size="11" font-weight="700" text-anchor="middle" fill="' + (deltaGood ? 'var(--viz-good-text)' : 'var(--viz-critical-text)') + '">' + (deltaGood ? '+' : '') + delta.toFixed(1) + '</text>';
    });
    return '<svg viewBox="0 0 ' + svgW + ' ' + svgH + '" width="100%" height="' + svgH + '" style="overflow:visible">' + body + '</svg>';
  }

  function renderBandBars(rows) {
    if (!rows.length) return '<div class="chart-empty">No data for the current filters.</div>';
    var labelW = 150, barH = 16, rowGap = 16, plotW = 900;
    var maxScale = 3;
    var rowH = barH + rowGap;
    var svgW = labelW + plotW + 50, svgH = rows.length * rowH + 8;
    var body = '';
    rows.forEach(function (r, i) {
      var y = i * rowH + 6;
      var w = (r.score / maxScale) * plotW;
      body += '<text x="0" y="' + (y + barH / 2 + 4) + '" font-size="12" fill="var(--viz-ink-secondary)">' + r.label + '</text>';
      body += '<path d="' + hBarPath(labelW, y, w, barH, 4) + '" fill="' + BAND_COLOR[r.band] + '"/>';
      body += '<text x="' + (labelW + w + 8) + '" y="' + (y + barH / 2 + 4) + '" font-size="11" fill="var(--viz-ink-secondary)">' + r.score.toFixed(1) + '</text>';
    });
    return '<svg viewBox="0 0 ' + svgW + ' ' + svgH + '" width="100%" height="' + svgH + '" style="overflow:visible">' + body + '</svg>';
  }

  function renderStackedLevels(rows) {
    if (!rows.length) return '<div class="chart-empty">No data for the current filters.</div>';
    var labelW = 170, barH = 20, rowGap = 16, plotW = 780, segGap = 2;
    var rowH = barH + rowGap;
    var svgW = labelW + plotW + 60, svgH = rows.length * rowH + 8;
    var shades = { Foundation: 'var(--viz-blue-100)', Proficient: 'var(--viz-blue-300)', Advance: 'var(--viz-blue-700)' };
    var textOn = { Foundation: 'var(--color-text-primary)', Proficient: '#ffffff', Advance: '#ffffff' };
    var body = '';
    rows.forEach(function (r, i) {
      var y = i * rowH + 6;
      var total = LEVELS.reduce(function (s, l) { return s + r.counts[l]; }, 0);
      body += '<text x="0" y="' + (y + barH / 2 + 4) + '" font-size="12" fill="var(--viz-ink-secondary)">' + r.label + '</text>';
      if (total === 0) {
        body += '<rect x="' + labelW + '" y="' + y + '" width="' + plotW + '" height="' + barH + '" rx="3" fill="var(--color-border-lighter)"/>';
      } else {
        var x = labelW;
        LEVELS.forEach(function (l) {
          var w = (r.counts[l] / total) * plotW;
          if (w > 1) {
            body += '<rect x="' + (x + segGap / 2) + '" y="' + y + '" width="' + Math.max(0, w - segGap) + '" height="' + barH + '" rx="3" fill="' + shades[l] + '"/>';
            if (w > 34) {
              body += '<text x="' + (x + w / 2) + '" y="' + (y + barH / 2 + 4) + '" font-size="10" font-weight="700" text-anchor="middle" fill="' + textOn[l] + '">' + r.counts[l] + '</text>';
            }
          }
          x += w;
        });
      }
      body += '<text x="' + (labelW + plotW + 10) + '" y="' + (y + barH / 2 + 4) + '" font-size="10" fill="var(--viz-ink-muted)">' + total + '</text>';
    });
    return '<svg viewBox="0 0 ' + svgW + ' ' + svgH + '" width="100%" height="' + svgH + '" style="overflow:visible">' + body + '</svg>';
  }

  function renderBandDistribution(rows, unitLabel) {
    unitLabel = unitLabel || 'comp.';
    if (!rows.length) return '<div class="chart-empty">No data for the current filters.</div>';
    var labelW = 150, barH = 22, rowGap = 18, plotW = 380, segGap = 2;
    var rowH = barH + rowGap;
    var svgW = labelW + plotW + 70, svgH = rows.length * rowH + 8;
    var body = '';
    rows.forEach(function (r, i) {
      var y = i * rowH + 6;
      body += '<text x="0" y="' + (y + barH / 2 + 4) + '" font-size="12" fill="var(--viz-ink-secondary)">' + r.label + '</text>';
      if (r.total === 0) {
        body += '<rect x="' + labelW + '" y="' + y + '" width="' + plotW + '" height="' + barH + '" rx="4" fill="var(--color-border-lighter)"/>';
      } else {
        var x = labelW;
        ['good', 'warning', 'critical'].forEach(function (b) {
          var w = (r.counts[b] / r.total) * plotW;
          if (w > 1) {
            body += '<rect x="' + (x + segGap / 2) + '" y="' + y + '" width="' + Math.max(0, w - segGap) + '" height="' + barH + '" rx="4" fill="' + BAND_COLOR[b] + '"/>';
            if (w > 22) {
              body += '<text x="' + (x + w / 2) + '" y="' + (y + barH / 2 + 4) + '" font-size="11" font-weight="700" text-anchor="middle" fill="#ffffff">' + r.counts[b] + '</text>';
            }
          }
          x += w;
        });
      }
      body += '<text x="' + (labelW + plotW + 10) + '" y="' + (y + barH / 2 + 4) + '" font-size="11" fill="var(--viz-ink-muted)">' + r.total + ' ' + unitLabel + '</text>';
    });
    return '<svg viewBox="0 0 ' + svgW + ' ' + svgH + '" width="100%" height="' + svgH + '" style="overflow:visible">' + body + '</svg>';
  }

  function groupBandDistribution(filtered) {
    return uniqueVals(filtered, 'group').map(function (g) {
      var comps = uniqueVals(filtered.filter(function (f) { return f.group === g; }), 'competency');
      var counts = { good: 0, warning: 0, critical: 0 };
      comps.forEach(function (c) {
        var rows = filtered.filter(function (f) { return f.competency === c; });
        counts[bandOf(avg(rows.map(function (r) { return r.weight; })), BENCHMARK[c])]++;
      });
      return { label: g, counts: counts, total: comps.length };
    });
  }

  /* per competency: how many distinct assessees land in each band, based on
     their own average score for that competency vs its benchmark */
  function assesseeBandDistributionByCompetency(filtered) {
    return uniqueVals(filtered, 'competency').map(function (c) {
      var rows = filtered.filter(function (f) { return f.competency === c; });
      var uids = uniqueVals(rows, 'assesseeUid');
      var counts = { good: 0, warning: 0, critical: 0 };
      uids.forEach(function (uid) {
        var userRows = rows.filter(function (r) { return r.assesseeUid === uid; });
        counts[bandOf(avg(userRows.map(function (r) { return r.weight; })), BENCHMARK[c])]++;
      });
      return { label: c, counts: counts, total: uids.length };
    });
  }

  function renderAreaTrend(points, benchmarkValue) {
    if (!points.length) return '<div class="chart-empty">No data for the current filters.</div>';
    var padL = 30, padB = 22, padT = 12, padR = 20;
    var plotW = 480, plotH = 170;
    var maxScale = 3;
    var svgW = padL + plotW + padR, svgH = padT + plotH + padB;
    var stepX = plotW / (points.length - 1 || 1);
    var scaleY = function (v) { return padT + plotH - (v / maxScale) * plotH; };
    var grid = '';
    [0, 1, 2, 3].forEach(function (g) {
      var y = scaleY(g);
      grid += '<line x1="' + padL + '" y1="' + y + '" x2="' + (padL + plotW) + '" y2="' + y + '" stroke="var(--viz-grid)" stroke-width="1"/>';
      grid += '<text x="' + (padL - 8) + '" y="' + (y + 3) + '" font-size="10" fill="var(--viz-ink-muted)" text-anchor="end">' + g + '</text>';
    });
    var benchY = scaleY(benchmarkValue);
    var benchLine = '<line x1="' + padL + '" y1="' + benchY + '" x2="' + (padL + plotW) + '" y2="' + benchY + '" stroke="var(--viz-benchmark)" stroke-width="2"/>' +
      '<text x="' + (padL + plotW - 4) + '" y="' + (benchY - 5) + '" font-size="10" fill="var(--viz-ink-secondary)" text-anchor="end">Benchmark ' + benchmarkValue.toFixed(1) + '</text>';
    var linePath = '', dots = '', labels = '';
    var pts = points.map(function (p, i) { return [padL + i * stepX, scaleY(p.value)]; });
    pts.forEach(function (p, i) {
      linePath += (i === 0 ? 'M' : 'L') + p[0] + ',' + p[1] + ' ';
      dots += '<circle cx="' + p[0] + '" cy="' + p[1] + '" r="4" fill="var(--viz-blue-500)" stroke="#ffffff" stroke-width="2"/>';
      labels += '<text x="' + p[0] + '" y="' + (padT + plotH + 16) + '" font-size="10" fill="var(--viz-ink-muted)" text-anchor="middle">' + points[i].label + '</text>';
    });
    var areaPath = linePath + 'L' + pts[pts.length - 1][0] + ',' + (padT + plotH) + ' L' + pts[0][0] + ',' + (padT + plotH) + ' Z';
    var lastPt = pts[pts.length - 1];
    var endLabel = '<text x="' + (lastPt[0] + 8) + '" y="' + (lastPt[1] - 8) + '" font-size="12" font-weight="700" fill="var(--viz-blue-700)">' + points[points.length - 1].value.toFixed(1) + '</text>';
    return '<svg viewBox="0 0 ' + svgW + ' ' + svgH + '" width="100%" height="' + svgH + '" style="overflow:visible">' +
      '<defs><linearGradient id="areaGrad" x1="0" y1="0" x2="0" y2="1">' +
      '<stop offset="0%" stop-color="var(--viz-blue-500)" stop-opacity="0.22"/>' +
      '<stop offset="100%" stop-color="var(--viz-blue-500)" stop-opacity="0.02"/></linearGradient></defs>' +
      grid + benchLine +
      '<path d="' + areaPath + '" fill="url(#areaGrad)"/>' +
      '<path d="' + linePath + '" fill="none" stroke="var(--viz-blue-500)" stroke-width="2.25" stroke-linejoin="round" stroke-linecap="round"/>' +
      dots + endLabel + labels + '</svg>';
  }

  function renderDonut(segments, centerValue, centerLabel) {
    var total = segments.reduce(function (s, x) { return s + x.value; }, 0);
    if (total === 0) return '<div class="chart-empty">No data for the current filters.</div>';
    var cx = 110, cy = 100, rOuter = 72, rInner = 48;
    var startAngle = -Math.PI / 2;
    var body = '', callouts = '';
    segments.forEach(function (s) {
      if (s.value <= 0) return;
      var frac = s.value / total;
      var endAngle = startAngle + frac * Math.PI * 2;
      var p1 = [cx + rOuter * Math.cos(startAngle), cy + rOuter * Math.sin(startAngle)];
      var p2 = [cx + rOuter * Math.cos(endAngle), cy + rOuter * Math.sin(endAngle)];
      var p3 = [cx + rInner * Math.cos(endAngle), cy + rInner * Math.sin(endAngle)];
      var p4 = [cx + rInner * Math.cos(startAngle), cy + rInner * Math.sin(startAngle)];
      var largeArc = (endAngle - startAngle) > Math.PI ? 1 : 0;
      var d = 'M' + p1[0] + ',' + p1[1] + ' A' + rOuter + ',' + rOuter + ' 0 ' + largeArc + ' 1 ' + p2[0] + ',' + p2[1] +
        ' L' + p3[0] + ',' + p3[1] + ' A' + rInner + ',' + rInner + ' 0 ' + largeArc + ' 0 ' + p4[0] + ',' + p4[1] + ' Z';
      body += '<path d="' + d + '" fill="' + s.color + '" stroke="#ffffff" stroke-width="3"/>';
      var midAngle = (startAngle + endAngle) / 2, pct = Math.round(frac * 100);
      if (pct >= 4) {
        var ax = Math.cos(midAngle), ay = Math.sin(midAngle);
        var lx1 = cx + (rOuter + 3) * ax, ly1 = cy + (rOuter + 3) * ay;
        var lx2 = cx + (rOuter + 17) * ax, ly2 = cy + (rOuter + 17) * ay;
        var tipX = lx2 + 5 * ax, tipY = ly2 + 5 * ay;
        var px = -ay, py = ax;
        var b1x = lx2 - 3 * px, b1y = ly2 - 3 * py;
        var b2x = lx2 + 3 * px, b2y = ly2 + 3 * py;
        var tx = cx + (rOuter + 23) * ax, ty = cy + (rOuter + 23) * ay;
        var anchor = ax > 0.15 ? 'start' : ax < -0.15 ? 'end' : 'middle';
        callouts += '<line x1="' + lx1 + '" y1="' + ly1 + '" x2="' + lx2 + '" y2="' + ly2 + '" stroke="' + s.color + '" stroke-width="1.5"/>' +
          '<polygon points="' + tipX + ',' + tipY + ' ' + b1x + ',' + b1y + ' ' + b2x + ',' + b2y + '" fill="' + s.color + '"/>' +
          '<text x="' + tx + '" y="' + (ty + 4) + '" font-size="12" font-weight="700" fill="var(--color-text-primary)" text-anchor="' + anchor + '">' + pct + '%</text>';
      }
      startAngle = endAngle;
    });
    var center = '<text x="' + cx + '" y="' + (cy - 3) + '" font-size="24" font-weight="700" fill="var(--color-text-primary)" text-anchor="middle">' + centerValue + '</text>' +
      '<text x="' + cx + '" y="' + (cy + 16) + '" font-size="11" fill="var(--viz-ink-muted)" text-anchor="middle">' + centerLabel + '</text>';
    return '<svg viewBox="0 0 220 200" width="100%" height="200" style="overflow:visible">' + body + callouts + center + '</svg>';
  }

  function heatmapHtml(filtered) {
    var competencies = ALL_COMPETENCIES.filter(function (c) { return filters.group ? GROUP_COMPETENCIES[filters.group].indexOf(c) > -1 : true; });
    var roles = filters.role ? [filters.role] : ROLES;
    var html = '<div class="heatmap-grid" style="grid-template-columns:150px repeat(' + roles.length + ', 1fr)">';
    html += '<div></div>' + roles.map(function (r) { return '<div class="heatmap-col-label">' + r + '</div>'; }).join('');
    competencies.forEach(function (c) {
      html += '<div class="heatmap-row-label">' + c + '</div>';
      roles.forEach(function (r) {
        var rows = filtered.filter(function (f) { return f.competency === c && f.role === r; });
        if (!rows.length) { html += '<div class="heatmap-cell heatmap-empty-cell">—</div>'; return; }
        var score = avg(rows.map(function (x) { return x.weight; }));
        var band = bandOf(score, BENCHMARK[c]);
        html += '<div class="heatmap-cell" style="background:' + BAND_BG[band] + ';color:' + BAND_TEXT[band] + '" title="' + c + ' · ' + r + ': ' + score.toFixed(1) + ' (n=' + rows.length + ')">' + score.toFixed(1) + '</div>';
      });
    });
    return html + '</div>';
  }

  function statusLegendHtml() {
    return ['good', 'warning', 'critical'].map(function (b) {
      return '<span class="status-legend-item"><span class="status-dot" style="background:' + BAND_COLOR[b] + '"></span>' + BAND_LABEL[b] + '</span>';
    }).join('');
  }

  /* ============================================================
     KPI tiles (5, compact)
  ============================================================ */
  function renderKpis(filtered) {
    var overallScore = avg(filtered.map(function (f) { return f.weight; }));
    // record-level benchmark so numerator and denominator average over the same rows
    var overallBenchmark = avg(filtered.map(function (f) { return f.benchmark; })) || 0;
    var attainment = overallBenchmark ? Math.round((overallScore / overallBenchmark) * 100) : 0;
    var attainBand = attainment >= 85 ? 'good' : attainment >= 70 ? 'warning' : 'critical';
    var trendByMonth = MONTH_LABELS.map(function (l, idx) { return avg(filtered.filter(function (f) { return f.month === idx; }).map(function (f) { return f.weight; })); });
    var scoreDeltaPct = trendByMonth[0] ? Math.round(((trendByMonth[trendByMonth.length - 1] - trendByMonth[0]) / trendByMonth[0]) * 100) : 0;

    var userBandCounts = { good: 0, warning: 0, critical: 0 };
    var assesseeUids = uniqueVals(filtered, 'assesseeUid');
    assesseeUids.forEach(function (uid) {
      var rows = filtered.filter(function (f) { return f.assesseeUid === uid; });
      userBandCounts[bandOf(avg(rows.map(function (r) { return r.weight; })), avg(rows.map(function (r) { return r.benchmark; })))]++;
    });
    var totalUsers = assesseeUids.length;

    var byCompetency = uniqueVals(filtered, 'competency').map(function (c) {
      var rows = filtered.filter(function (f) { return f.competency === c; });
      return { label: c, score: avg(rows.map(function (r) { return r.weight; })), benchmark: BENCHMARK[c] };
    });
    var worst = byCompetency.slice().sort(function (a, b) { return (a.score - a.benchmark) - (b.score - b.benchmark); })[0];

    var html = '';

    /* 1 — average score + trend + sparkline */

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>LnD Dashboard — Competency Insights</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --color-bg: #f4f5f6;
    --color-sidebar-bg: #eef1f4;
    --color-card: #ffffff;
    --color-text-primary: #12233d;
    --color-text-secondary: #5a6a7d;
    --color-text-tertiary: #6b7480;
    --color-accent: #1668e3;
    --color-accent-hover: #1253ba;
    --color-accent-tint-bg: #dbeafe;
    --color-accent-tint-text: #1d4ed8;
    --color-neutral-tint-bg: #eef0f2;
    --color-neutral-tint-text: #3c4757;
    --color-border: #d7dbe0;
    --color-border-light: #e3e6ea;
    --color-border-lighter: #edeff2;
    --radius-sm: 8px; --radius-md: 10px; --radius-lg: 12px; --radius-pill: 999px;
    --space-1: 4px; --space-2: 8px; --space-3: 12px; --space-4: 16px; --space-5: 20px; --space-6: 24px; --space-8: 32px;
    --font-body: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
    --fs-page-title: 25px; --fs-app-title: 17px; --fs-body: 14px; --fs-small: 13px; --fs-label: 11px;
    --shadow-card: 0 1px 2px rgba(18, 35, 61, 0.04), 0 8px 24px rgba(18, 35, 61, 0.06);

    --viz-blue-700: #1d4ed8;
    --viz-blue-500: #1668e3;
    --viz-blue-300: #7ea6ef;
    --viz-blue-100: #dbeafe;
    --viz-benchmark: #b7bcc4;
    --viz-good-bg: #dcfce7; --viz-good-text: #15803d; --viz-good: #16a34a;
    --viz-warning-bg: #fef3c7; --viz-warning-text: #b45309; --viz-warning: #d97706;
    --viz-critical-bg: #fee2e2; --viz-critical-text: #b91c1c; --viz-critical: #dc2626;
    --viz-ink-secondary: #5a6a7d;
    --viz-ink-muted: #8a94a3;
    --viz-grid: #e7eaee;
  }

  * , *::before, *::after { box-sizing: border-box; }
  body { margin: 0; background: var(--color-bg); color: var(--color-text-primary); font-family: var(--font-body); font-size: var(--fs-body); line-height: 1.5; padding: var(--space-6); }
  h1, h2, h3 { margin: 0; font-weight: 700; }
  button { font-family: inherit; cursor: pointer; }
  input, select, textarea { font-family: inherit; }

  .app-shell { width: 1440px; max-width: 100%; margin: 0 auto; display: flex; flex-direction: column; background: var(--color-card); border: 1px solid var(--color-border-light); border-radius: var(--radius-lg); box-shadow: var(--shadow-card); overflow: hidden; }
  .topbar { height: 64px; flex: none; display: flex; align-items: center; justify-content: space-between; gap: var(--space-4); padding: 0 var(--space-6); border-bottom: 1px solid var(--color-border-light); background: var(--color-card); }
  .topbar-left { display: flex; align-items: center; gap: var(--space-3); }
  .logo-mark { width: 32px; height: 32px; flex: none; display: flex; align-items: center; justify-content: center; background: var(--color-accent); color: #ffffff; border-radius: var(--radius-sm); font-weight: 700; font-size: 15px; }
  .app-title { font-size: var(--fs-app-title); font-weight: 700; color: var(--color-text-primary); }
  .breadcrumb { font-size: var(--fs-app-title); font-weight: 500; color: var(--color-text-secondary); }
  .topbar-right { display: flex; align-items: center; gap: var(--space-4); }
  .icon-plain { display: flex; align-items: center; justify-content: center; color: var(--color-text-secondary); background: transparent; border: none; }
  .topbar-user { font-size: var(--fs-body); color: var(--color-text-primary); white-space: nowrap; }
  .avatar { width: 36px; height: 36px; flex: none; display: flex; align-items: center; justify-content: center; background: var(--color-accent); color: #ffffff; border-radius: var(--radius-pill); font-weight: 700; font-size: var(--fs-small); }

  .app-body { display: flex; align-items: stretch; }
  .sidebar { width: 238px; flex: none; display: flex; flex-direction: column; gap: var(--space-6); padding: var(--space-5) var(--space-3); background: var(--color-sidebar-bg); border-right: 1px solid var(--color-border-light); }
  .nav-list { display: flex; flex-direction: column; gap: var(--space-1); }
  .nav-item { display: flex; align-items: center; gap: var(--space-3); padding: var(--space-3); border-radius: var(--radius-md); color: var(--color-text-secondary); text-decoration: none; font-size: var(--fs-body); font-weight: 500; }
  .nav-item svg { flex: none; }
  .nav-item:hover { background: rgba(255, 255, 255, 0.6); }
  .nav-item.is-active { background: var(--color-card); color: var(--color-accent); font-weight: 600; box-shadow: 0 1px 2px rgba(18, 35, 61, 0.06); }

  .content { flex: 1; min-width: 0; padding: var(--space-6); background: var(--color-bg); }
  .content-inner { display: flex; flex-direction: column; gap: var(--space-4); }
  .page-title { font-size: var(--fs-page-title); }
  .page-header { display: flex; align-items: flex-start; justify-content: space-between; gap: var(--space-4); }

  /* ---- filter toggle + row ---- */
  .btn-filter-toggle {
    display: inline-flex; align-items: center; gap: var(--space-2);
    height: 36px; padding: 0 var(--space-3); border-radius: var(--radius-md);
    border: 1px solid var(--color-border); background: var(--color-card);
    color: var(--color-text-secondary); font-size: var(--fs-small); font-weight: 600;
  }
  .btn-filter-toggle:hover { background: var(--color-border-lighter); color: var(--color-text-primary); }
  .btn-filter-toggle .chev { transition: transform 0.15s ease; }
  .btn-filter-toggle.is-collapsed .chev { transform: rotate(-90deg); }
  .active-count { display: inline-flex; align-items: center; justify-content: center; min-width: 17px; height: 17px; padding: 0 5px; border-radius: var(--radius-pill); background: var(--color-accent); color: #fff; font-size: 10px; font-weight: 700; }

  .filters-row { display: flex; align-items: center; gap: var(--space-3); flex-wrap: wrap; }
  .filters-row[hidden] { display: none; }
  .field-with-icon { position: relative; display: flex; align-items: center; }
  .search-input { width: 220px; height: 38px; padding: 0 var(--space-3) 0 36px; border: 1px solid var(--color-border); border-radius: var(--radius-md); font-size: var(--fs-small); color: var(--color-text-primary); background: var(--color-card); }
  .field-with-icon .field-icon { position: absolute; left: var(--space-3); color: var(--color-text-tertiary); display: flex; }
  .filter-select, .filter-date { height: 38px; padding: 0 var(--space-3); border: 1px solid var(--color-border); border-radius: var(--radius-md); font-size: var(--fs-small); color: var(--color-text-primary); background: var(--color-card); }
  .filters-row-spacer { flex: 1; }
  .filter-result-count { font-size: var(--fs-small); color: var(--color-text-tertiary); }

  /* ---- compact KPI tiles ---- */
  .kpi-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: var(--space-3); }
  .kpi-tile {
    background: var(--color-card); border: 1px solid var(--color-border-light); border-radius: var(--radius-md);
    padding: 10px var(--space-3); display: flex; flex-direction: column; gap: 5px;
    border-left: 3px solid var(--kpi-accent, var(--color-accent));
  }
  .kpi-tile-top { display: flex; align-items: center; justify-content: space-between; gap: var(--space-2); }
  .kpi-icon {
    width: 26px; height: 26px; flex: none; border-radius: var(--radius-sm);
    display: flex; align-items: center; justify-content: center;
    background: var(--kpi-icon-bg, var(--color-accent-tint-bg)); color: var(--kpi-icon-fg, var(--color-accent));
  }
  .kpi-trend { display: inline-flex; align-items: center; gap: 3px; font-size: 10px; font-weight: 700; padding: 2px 6px; border-radius: var(--radius-pill); }
  .kpi-trend.is-good { background: var(--viz-good-bg); color: var(--viz-good-text); }
  .kpi-trend.is-bad { background: var(--viz-critical-bg); color: var(--viz-critical-text); }
  .kpi-label { font-size: var(--fs-label); color: var(--color-text-tertiary); line-height: 1.2; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .kpi-value { font-size: 21px; font-weight: 700; color: var(--color-text-primary); line-height: 1.1; }
  .kpi-value .sub { font-size: 12px; font-weight: 600; color: var(--color-text-tertiary); }
  .kpi-foot { margin-top: 0; }
  .kpi-mini-bar-track { display: flex; height: 6px; border-radius: var(--radius-pill); overflow: hidden; background: var(--color-border-lighter); }
  .kpi-mini-bar-seg { height: 100%; }
  .kpi-mini-legend { display: flex; gap: var(--space-2); font-size: 10px; line-height: 1.3; color: var(--color-text-tertiary); margin-top: 4px; white-space: nowrap; }
  .kpi-note { font-size: 10px; line-height: 1.3; color: var(--color-text-tertiary); }
  .kpi-gap-name { font-size: 12px; line-height: 1.3; font-weight: 600; color: var(--color-text-primary); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  /* ---- tabs ---- */
  .report-tabs { display: flex; align-items: center; gap: var(--space-2); border-bottom: 1px solid var(--color-border-light); }
  .report-tab {
    padding: var(--space-3) var(--space-2); border: none; background: transparent;
    border-bottom: 2px solid transparent; font-size: var(--fs-body); font-weight: 500;
    color: var(--color-text-secondary); margin-bottom: -1px; white-space: nowrap;
  }
  .report-tab:hover { color: var(--color-text-primary); }
  .report-tab.is-active { color: var(--color-accent); font-weight: 700; border-bottom-color: var(--color-accent); }

  /* ---- chart cards ---- */
  .tab-body { display: flex; flex-direction: column; gap: var(--space-4); }
  .chart-card { background: var(--color-card); border: 1px solid var(--color-border-light); border-radius: var(--radius-lg); padding: var(--space-4) var(--space-5) var(--space-5); display: flex; flex-direction: column; gap: var(--space-3); min-width: 0; }
  .chart-header { display: flex; align-items: flex-start; justify-content: space-between; gap: var(--space-4); flex-wrap: wrap; }
  .chart-title { font-size: 16px; font-weight: 700; }
  .chart-subtitle { font-size: var(--fs-label); color: var(--color-text-tertiary); margin-top: 2px; }
  .chart-body { flex: 1; display: flex; flex-direction: column; justify-content: center; min-width: 0; }
  .chart-legend { display: flex; align-items: center; gap: var(--space-4); flex-wrap: wrap; font-size: var(--fs-label); color: var(--color-text-secondary); }
  .chart-legend-item { display: flex; align-items: center; gap: 6px; }
  .chart-legend-swatch { width: 10px; height: 10px; border-radius: 3px; flex: none; }
  .chart-empty { font-size: var(--fs-small); color: var(--color-text-tertiary); padding: var(--space-6) 0; text-align: center; }
  .row-2col { display: grid; grid-template-columns: 1.6fr 1fr; gap: var(--space-4); align-items: stretch; }

  .status-legend { display: flex; align-items: center; gap: var(--space-4); flex-wrap: wrap; }
  .status-legend-item { display: flex; align-items: center; gap: var(--space-2); font-size: var(--fs-small); color: var(--color-text-secondary); }
  .status-dot { width: 9px; height: 9px; border-radius: 50%; flex: none; }

  /* ---- band distribution (scrolls vertically once rows exceed the visible window) ---- */
  .band-dist-scroll { max-height: 260px; overflow-y: auto; padding-right: var(--space-2); }
  .band-dist-scroll::-webkit-scrollbar { width: 6px; }
  .band-dist-scroll::-webkit-scrollbar-thumb { background: var(--color-border-light); border-radius: 3px; }

  /* ---- heatmap ---- */
  .heatmap-scroll { overflow-x: auto; }
  .heatmap-grid { display: grid; gap: 3px; min-width: 640px; }
  .heatmap-cell { display: flex; align-items: center; justify-content: center; border-radius: var(--radius-sm); padding: var(--space-2); font-size: var(--fs-small); font-weight: 700; min-height: 42px; }
  .heatmap-row-label { display: flex; align-items: center; font-size: var(--fs-small); color: var(--color-text-secondary); padding-right: var(--space-2); white-space: nowrap; }
  .heatmap-col-label { display: flex; align-items: center; justify-content: center; font-size: var(--fs-label); font-weight: 700; color: var(--color-text-tertiary); text-transform: uppercase; letter-spacing: 0.03em; padding-bottom: var(--space-1); text-align: center; }
  .heatmap-empty-cell { background: var(--color-border-lighter); color: var(--color-text-tertiary); font-weight: 500; }

  /* ---- report table ---- */
  .report-table-wrap { border: 1px solid var(--color-border-light); border-radius: var(--radius-md); overflow: hidden; }
  .report-table { width: 100%; border-collapse: collapse; }
  .report-table th {
    text-align: left; font-size: var(--fs-label); letter-spacing: 0.04em; text-transform: uppercase;
    color: var(--color-text-tertiary); font-weight: 700; padding: var(--space-3) var(--space-4);
    background: var(--color-bg); border-bottom: 1px solid var(--color-border-light);
  }
  .report-table td { padding: var(--space-3) var(--space-4); border-bottom: 1px solid var(--color-border-lighter); font-size: var(--fs-body); }
  .report-table tbody tr:last-child td { border-bottom: none; }
  .report-table tbody tr:hover { background: var(--color-bg); }
  .mini-bar-track { width: 96px; height: 8px; border-radius: var(--radius-pill); background: var(--color-border-lighter); overflow: hidden; display: inline-block; vertical-align: middle; margin-right: var(--space-2); }
  .mini-bar-fill { height: 100%; border-radius: var(--radius-pill); display: block; }
  .band-pill { display: inline-flex; align-items: center; gap: 6px; font-size: var(--fs-small); font-weight: 600; }
</style>
</head>

<script>
  /* ============================================================
     Deterministic dataset
  ============================================================ */
  function mulberry32(seed) {
    return function () {
      seed |= 0; seed = (seed + 0x6D2B79F5) | 0;
      var t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  var rng = mulberry32(1234);

    'Manual Tester': ['Technical Skills', 'Product Knowledge']
  };

    { uid: 'PM003', name: 'Priya Menon' }, { uid: 'AK004', name: 'Arjun Kapoor' }, { uid: 'NV005', name: 'Neha Verma' }
  ];
  var FIRST_NAMES = ['Craig', 'Baljeet', 'Amit', 'Ankush', 'Kunjal', 'Latha', 'Shuchi', 'Uday', 'Meera', 'Vikram', 'Farah', 'Ishaan', 'Divya', 'Rohit', 'Ananya', 'Karan', 'Simran', 'Aditya', 'Priyanka', 'Manish', 'Ritu', 'Naveen', 'Sneha', 'Gaurav', 'Kavita', 'Deepak', 'Nisha', 'Rajat', 'Pooja', 'Vivek'];
  var LAST_NAMES = ['Allies', 'Kumar', 'Kapoor', 'Kamra', 'Modi', 'Raut', 'Bharadwaj', 'Alhat', 'Shah', 'Nair', 'Sheikh', 'Roy', 'Pillai', 'Sinha', 'Iyer', 'Malhotra', 'Kaur', 'Rao', 'Das', 'Gupta', 'Chawla', 'Reddy', 'Joshi', 'Bhatt', 'Pawar', 'Chandra', 'Verma', 'Mehta', 'Bose', 'Menon'];
  var SURVEYS = [
    { id: 'SI001', role: 'CAT Developer' }, { id: 'SI002', role: 'Tester' },
    { id: 'SI003', role: 'P-MD' }, { id: 'SI004', role: 'Manual Tester' },
    { id: 'SI005', role: 'CAT Developer' }, { id: 'SI006', role: 'Tester' }
  ];
  var MONTH_LABELS = ['Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep'];

  /* Per-competency capability profile (0 = weak, 1 = strong). Real orgs are
     uneven — some competencies systematically lag their benchmark and some
     clear it comfortably. Without this every competency averages the same and
     every band chart comes out solid green. */
  var COMPETENCY_STRENGTH = {
    'Account Management': 0.35,
    'Business Development': 0.75,
    'Product Positioning': 0.55,
    'Technical Fluency': 0.85,
    'Communication Skills': 0.70,
    'Problem Solving': 0.40,
    'Teamwork': 0.80,
    'System Design': 0.28,
    'Code Quality': 0.60
  };

  function pickLevel(competency) {
    var s = COMPETENCY_STRENGTH[competency];
    if (s === undefined) s = 0.6;
    var pFoundation = (1 - s) * 0.6;
    var pAdvance = s * 0.55;
    var r = rng();
    if (r < pFoundation) return 'Foundation';
    if (r < pFoundation + pAdvance) return 'Advance';
    return 'Proficient';
  }

  var ASSESSEES = [];
  (function () {
    for (var i = 0; i < 30; i++) {
      var first = FIRST_NAMES[i % FIRST_NAMES.length];
      var last = LAST_NAMES[(i + 7) % LAST_NAMES.length];
      var role = ROLES[i % ROLES.length];
      var uid = (first.slice(0, 2) + last.slice(0, 2)).toUpperCase() + (100 + i);
      ASSESSEES.push({ uid: uid, name: first + ' ' + last, role: role });
    }
  })();

  var FACTS = [];
  (function () {
    ASSESSEES.forEach(function (a) {
      var groups = ROLE_GROUPS[a.role];
      var roleSurveys = SURVEYS.filter(function (s) { return s.role === a.role; });
      var survey = roleSurveys[Math.floor(rng() * roleSurveys.length)];
      var monthIdx = Math.floor(rng() * MONTH_LABELS.length);
      var assessor = ASSESSORS[Math.floor(rng() * ASSESSORS.length)];
      groups.forEach(function (g) {
        GROUP_COMPETENCIES[g].forEach(function (c) {
          var level = pickLevel(c);
          FACTS.push({
            assesseeUid: a.uid, assesseeName: a.name, role: a.role,
            assessorUid: assessor.uid, assessorName: assessor.name,
            surveyId: survey.id, group: g, competency: c,
            level: level, weight: LEVEL_WEIGHT[level], benchmark: BENCHMARK[c], month: monthIdx
          });
        });
      });
    });
  })();

  /* ============================================================
     Filters
  ============================================================ */
  var filters = { search: '', role: '', group: '', start: '', end: '' };

  function uniqueVals(arr, key) {
    var seen = {}, out = [];
    arr.forEach(function (x) { if (!seen[x[key]]) { seen[x[key]] = true; out.push(x[key]); } });
    return out;
  }
  function monthToDate(m) { return new Date(2026, 3 + m, 15); }

  function applyFilters() {
    var q = filters.search.trim().toLowerCase();
    return FACTS.filter(function (f) {
      if (q && f.assesseeName.toLowerCase().indexOf(q) === -1 && f.assesseeUid.toLowerCase().indexOf(q) === -1) return false;
      if (filters.role && f.role !== filters.role) return false;
      if (filters.group && f.group !== filters.group) return false;
      if (filters.start && monthToDate(f.month) < new Date(filters.start)) return false;
      if (filters.end && monthToDate(f.month) > new Date(filters.end)) return false;
      return true;
    });
  }

  document.getElementById('role-filter').innerHTML += ROLES.map(function (r) { return '<option value="' + r + '">' + r + '</option>'; }).join('');
  document.getElementById('group-filter').innerHTML += GROUP_NAMES.map(function (g) { return '<option value="' + g + '">' + g + '</option>'; }).join('');

  ['search-input', 'role-filter', 'group-filter', 'start-filter', 'end-filter'].forEach(function (id) {
    var el = document.getElementById(id);
    var key = id === 'search-input' ? 'search' : id === 'role-filter' ? 'role' : id === 'group-filter' ? 'group' : id === 'start-filter' ? 'start' : 'end';
    var evt = (el.tagName === 'INPUT' && el.type === 'text') ? 'input' : 'change';
    el.addEventListener(evt, function () { filters[key] = el.value; renderAll(); });
  });

  /* ---- hide/show filters ---- */
  var filtersVisible = true;
  document.getElementById('filter-toggle-btn').addEventListener('click', function () {
    filtersVisible = !filtersVisible;
    document.getElementById('filters-row').hidden = !filtersVisible;
    this.classList.toggle('is-collapsed', !filtersVisible);
    document.getElementById('filter-toggle-text').textContent = filtersVisible ? 'Hide filters' : 'Show filters';
  });

  function activeFilterCount() {
    return Object.keys(filters).filter(function (k) { return !!filters[k]; }).length;
  }

  /* ============================================================
     Shared helpers
  ============================================================ */
  function bandOf(score, benchmark) {
    if (!benchmark) return 'good';
    var ratio = score / benchmark;
    if (ratio >= 0.85) return 'good';
    if (ratio >= 0.70) return 'warning';
    return 'critical';
  }
  var BAND_COLOR = { good: 'var(--viz-good)', warning: 'var(--viz-warning)', critical: 'var(--viz-critical)' };
  var BAND_BG = { good: 'var(--viz-good-bg)', warning: 'var(--viz-warning-bg)', critical: 'var(--viz-critical-bg)' };
  var BAND_TEXT = { good: 'var(--viz-good-text)', warning: 'var(--viz-warning-text)', critical: 'var(--viz-critical-text)' };
  var BAND_LABEL = { good: '≥ 85% of benchmark', warning: '70–85% of benchmark', critical: '< 70% of benchmark' };
  function avg(arr) { return arr.length ? arr.reduce(function (s, v) { return s + v; }, 0) / arr.length : 0; }

  function hBarPath(x, y, w, h, r) {
    if (w <= 0) return '';
    r = Math.max(0, Math.min(r, w / 2, h / 2));
    return 'M' + x + ',' + y + ' L' + (x + w - r) + ',' + y + ' Q' + (x + w) + ',' + y + ' ' + (x + w) + ',' + (y + r) +
      ' L' + (x + w) + ',' + (y + h - r) + ' Q' + (x + w) + ',' + (y + h) + ' ' + (x + w - r) + ',' + (y + h) +
      ' L' + x + ',' + (y + h) + ' Z';
  }

  function sparkline(values, w, h) {
    if (values.length < 2) return '';
    var max = Math.max.apply(null, values.concat([0.01]));
    var stepX = w / (values.length - 1);
    var pts = values.map(function (v, i) { return [i * stepX, h - (v / max) * h]; });
    var path = pts.map(function (p, i) { return (i === 0 ? 'M' : 'L') + p[0].toFixed(1) + ',' + p[1].toFixed(1); }).join(' ');
    var last = pts[pts.length - 1];
    return '<svg width="' + w + '" height="' + h + '" viewBox="0 0 ' + w + ' ' + h + '">' +
      '<path d="' + path + '" fill="none" stroke="var(--viz-blue-500)" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" opacity="0.75"/>' +
      '<circle cx="' + last[0].toFixed(1) + '" cy="' + last[1].toFixed(1) + '" r="2.5" fill="var(--viz-blue-500)"/></svg>';
  }

  /* ============================================================
     Chart renderers
  ============================================================ */
  function renderPairBars(rows) {
    if (!rows.length) return '<div class="chart-empty">No data for the current filters.</div>';
    var labelW = 170, barH = 15, gap = 2, rowGap = 18, plotW = 780, pillW = 60;
    var maxScale = 3;
    var rowH = barH * 2 + gap + rowGap;
    var svgW = labelW + plotW + pillW + 60, svgH = rows.length * rowH + 8;
    var scaleX = function (v) { return (v / maxScale) * plotW; };
    var body = '';
    rows.forEach(function (r, i) {
      var y = i * rowH + 6;
      var aw = scaleX(r.score), bw = scaleX(r.benchmark);
      var delta = r.score - r.benchmark;
      if (Math.abs(delta) < 0.05) delta = 0;
      var deltaGood = delta >= 0;
      body += '<text x="0" y="' + (y + barH + gap / 2 + 4) + '" font-size="12" fill="var(--viz-ink-secondary)">' + r.label + '</text>';
      body += '<path d="' + hBarPath(labelW, y, aw, barH, 4) + '" fill="var(--viz-blue-500)"/>';
      body += '<text x="' + (labelW + aw + 6) + '" y="' + (y + barH - 2) + '" font-size="11" fill="var(--viz-ink-secondary)">' + r.score.toFixed(1) + '</text>';
      var y2 = y + barH + gap;
      body += '<path d="' + hBarPath(labelW, y2, bw, barH, 4) + '" fill="var(--viz-benchmark)"/>';
      body += '<text x="' + (labelW + bw + 6) + '" y="' + (y2 + barH - 2) + '" font-size="11" fill="var(--viz-ink-secondary)">' + r.benchmark.toFixed(1) + '</text>';
      var pillX = labelW + plotW + 20, pillY = y + (barH * 2 + gap) / 2 - 9;
      body += '<rect x="' + pillX + '" y="' + pillY + '" width="' + pillW + '" height="18" rx="9" fill="' + (deltaGood ? 'var(--viz-good-bg)' : 'var(--viz-critical-bg)') + '"/>';
      body += '<text x="' + (pillX + pillW / 2) + '" y="' + (pillY + 13) + '" font-size="11" font-weight="700" text-anchor="middle" fill="' + (deltaGood ? 'var(--viz-good-text)' : 'var(--viz-critical-text)') + '">' + (deltaGood ? '+' : '') + delta.toFixed(1) + '</text>';
    });
    return '<svg viewBox="0 0 ' + svgW + ' ' + svgH + '" width="100%" height="' + svgH + '" style="overflow:visible">' + body + '</svg>';
  }

  function renderBandBars(rows) {
    if (!rows.length) return '<div class="chart-empty">No data for the current filters.</div>';
    var labelW = 150, barH = 16, rowGap = 16, plotW = 900;
    var maxScale = 3;
    var rowH = barH + rowGap;
    var svgW = labelW + plotW + 50, svgH = rows.length * rowH + 8;
    var body = '';
    rows.forEach(function (r, i) {
      var y = i * rowH + 6;
      var w = (r.score / maxScale) * plotW;
      body += '<text x="0" y="' + (y + barH / 2 + 4) + '" font-size="12" fill="var(--viz-ink-secondary)">' + r.label + '</text>';
      body += '<path d="' + hBarPath(labelW, y, w, barH, 4) + '" fill="' + BAND_COLOR[r.band] + '"/>';
      body += '<text x="' + (labelW + w + 8) + '" y="' + (y + barH / 2 + 4) + '" font-size="11" fill="var(--viz-ink-secondary)">' + r.score.toFixed(1) + '</text>';
    });
    return '<svg viewBox="0 0 ' + svgW + ' ' + svgH + '" width="100%" height="' + svgH + '" style="overflow:visible">' + body + '</svg>';
  }

  function renderStackedLevels(rows) {
    if (!rows.length) return '<div class="chart-empty">No data for the current filters.</div>';
    var labelW = 170, barH = 20, rowGap = 16, plotW = 780, segGap = 2;
    var rowH = barH + rowGap;
    var svgW = labelW + plotW + 60, svgH = rows.length * rowH + 8;
    var shades = { Foundation: 'var(--viz-blue-100)', Proficient: 'var(--viz-blue-300)', Advance: 'var(--viz-blue-700)' };
    var textOn = { Foundation: 'var(--color-text-primary)', Proficient: '#ffffff', Advance: '#ffffff' };
    var body = '';
    rows.forEach(function (r, i) {
      var y = i * rowH + 6;
      var total = LEVELS.reduce(function (s, l) { return s + r.counts[l]; }, 0);
      body += '<text x="0" y="' + (y + barH / 2 + 4) + '" font-size="12" fill="var(--viz-ink-secondary)">' + r.label + '</text>';
      if (total === 0) {
        body += '<rect x="' + labelW + '" y="' + y + '" width="' + plotW + '" height="' + barH + '" rx="3" fill="var(--color-border-lighter)"/>';
      } else {
        var x = labelW;
        LEVELS.forEach(function (l) {
          var w = (r.counts[l] / total) * plotW;
          if (w > 1) {
            body += '<rect x="' + (x + segGap / 2) + '" y="' + y + '" width="' + Math.max(0, w - segGap) + '" height="' + barH + '" rx="3" fill="' + shades[l] + '"/>';
            if (w > 34) {
              body += '<text x="' + (x + w / 2) + '" y="' + (y + barH / 2 + 4) + '" font-size="10" font-weight="700" text-anchor="middle" fill="' + textOn[l] + '">' + r.counts[l] + '</text>';
            }
          }
          x += w;
        });
      }
      body += '<text x="' + (labelW + plotW + 10) + '" y="' + (y + barH / 2 + 4) + '" font-size="10" fill="var(--viz-ink-muted)">' + total + '</text>';
    });
    return '<svg viewBox="0 0 ' + svgW + ' ' + svgH + '" width="100%" height="' + svgH + '" style="overflow:visible">' + body + '</svg>';
  }

  function renderBandDistribution(rows, unitLabel) {
    unitLabel = unitLabel || 'comp.';
    if (!rows.length) return '<div class="chart-empty">No data for the current filters.</div>';
    var labelW = 150, barH = 22, rowGap = 18, plotW = 380, segGap = 2;
    var rowH = barH + rowGap;
    var svgW = labelW + plotW + 70, svgH = rows.length * rowH + 8;
    var body = '';
    rows.forEach(function (r, i) {
      var y = i * rowH + 6;
      body += '<text x="0" y="' + (y + barH / 2 + 4) + '" font-size="12" fill="var(--viz-ink-secondary)">' + r.label + '</text>';
      if (r.total === 0) {
        body += '<rect x="' + labelW + '" y="' + y + '" width="' + plotW + '" height="' + barH + '" rx="4" fill="var(--color-border-lighter)"/>';
      } else {
        var x = labelW;
        ['good', 'warning', 'critical'].forEach(function (b) {
          var w = (r.counts[b] / r.total) * plotW;
          if (w > 1) {
            body += '<rect x="' + (x + segGap / 2) + '" y="' + y + '" width="' + Math.max(0, w - segGap) + '" height="' + barH + '" rx="4" fill="' + BAND_COLOR[b] + '"/>';
            if (w > 22) {
              body += '<text x="' + (x + w / 2) + '" y="' + (y + barH / 2 + 4) + '" font-size="11" font-weight="700" text-anchor="middle" fill="#ffffff">' + r.counts[b] + '</text>';
            }
          }
          x += w;
        });
      }
      body += '<text x="' + (labelW + plotW + 10) + '" y="' + (y + barH / 2 + 4) + '" font-size="11" fill="var(--viz-ink-muted)">' + r.total + ' ' + unitLabel + '</text>';
    });
    return '<svg viewBox="0 0 ' + svgW + ' ' + svgH + '" width="100%" height="' + svgH + '" style="overflow:visible">' + body + '</svg>';
  }

  function groupBandDistribution(filtered) {
    return uniqueVals(filtered, 'group').map(function (g) {
      var comps = uniqueVals(filtered.filter(function (f) { return f.group === g; }), 'competency');
      var counts = { good: 0, warning: 0, critical: 0 };
      comps.forEach(function (c) {
        var rows = filtered.filter(function (f) { return f.competency === c; });
        counts[bandOf(avg(rows.map(function (r) { return r.weight; })), BENCHMARK[c])]++;
      });
      return { label: g, counts: counts, total: comps.length };
    });
  }

  /* per competency: how many distinct assessees land in each band, based on
     their own average score for that competency vs its benchmark */
  function assesseeBandDistributionByCompetency(filtered) {
    return uniqueVals(filtered, 'competency').map(function (c) {
      var rows = filtered.filter(function (f) { return f.competency === c; });
      var uids = uniqueVals(rows, 'assesseeUid');
      var counts = { good: 0, warning: 0, critical: 0 };
      uids.forEach(function (uid) {
        var userRows = rows.filter(function (r) { return r.assesseeUid === uid; });
        counts[bandOf(avg(userRows.map(function (r) { return r.weight; })), BENCHMARK[c])]++;
      });
      return { label: c, counts: counts, total: uids.length };
    });
  }

  function renderAreaTrend(points, benchmarkValue) {
    if (!points.length) return '<div class="chart-empty">No data for the current filters.</div>';
    var padL = 30, padB = 22, padT = 12, padR = 20;
    var plotW = 480, plotH = 170;
    var maxScale = 3;
    var svgW = padL + plotW + padR, svgH = padT + plotH + padB;
    var stepX = plotW / (points.length - 1 || 1);
    var scaleY = function (v) { return padT + plotH - (v / maxScale) * plotH; };
    var grid = '';
    [0, 1, 2, 3].forEach(function (g) {
      var y = scaleY(g);
      grid += '<line x1="' + padL + '" y1="' + y + '" x2="' + (padL + plotW) + '" y2="' + y + '" stroke="var(--viz-grid)" stroke-width="1"/>';
      grid += '<text x="' + (padL - 8) + '" y="' + (y + 3) + '" font-size="10" fill="var(--viz-ink-muted)" text-anchor="end">' + g + '</text>';
    });
    var benchY = scaleY(benchmarkValue);
    var benchLine = '<line x1="' + padL + '" y1="' + benchY + '" x2="' + (padL + plotW) + '" y2="' + benchY + '" stroke="var(--viz-benchmark)" stroke-width="2"/>' +
      '<text x="' + (padL + plotW - 4) + '" y="' + (benchY - 5) + '" font-size="10" fill="var(--viz-ink-secondary)" text-anchor="end">Benchmark ' + benchmarkValue.toFixed(1) + '</text>';
    var linePath = '', dots = '', labels = '';
    var pts = points.map(function (p, i) { return [padL + i * stepX, scaleY(p.value)]; });
    pts.forEach(function (p, i) {
      linePath += (i === 0 ? 'M' : 'L') + p[0] + ',' + p[1] + ' ';
      dots += '<circle cx="' + p[0] + '" cy="' + p[1] + '" r="4" fill="var(--viz-blue-500)" stroke="#ffffff" stroke-width="2"/>';
      labels += '<text x="' + p[0] + '" y="' + (padT + plotH + 16) + '" font-size="10" fill="var(--viz-ink-muted)" text-anchor="middle">' + points[i].label + '</text>';
    });
    var areaPath = linePath + 'L' + pts[pts.length - 1][0] + ',' + (padT + plotH) + ' L' + pts[0][0] + ',' + (padT + plotH) + ' Z';
    var lastPt = pts[pts.length - 1];
    var endLabel = '<text x="' + (lastPt[0] + 8) + '" y="' + (lastPt[1] - 8) + '" font-size="12" font-weight="700" fill="var(--viz-blue-700)">' + points[points.length - 1].value.toFixed(1) + '</text>';
    return '<svg viewBox="0 0 ' + svgW + ' ' + svgH + '" width="100%" height="' + svgH + '" style="overflow:visible">' +
      '<defs><linearGradient id="areaGrad" x1="0" y1="0" x2="0" y2="1">' +
      '<stop offset="0%" stop-color="var(--viz-blue-500)" stop-opacity="0.22"/>' +
      '<stop offset="100%" stop-color="var(--viz-blue-500)" stop-opacity="0.02"/></linearGradient></defs>' +
      grid + benchLine +
      '<path d="' + areaPath + '" fill="url(#areaGrad)"/>' +
      '<path d="' + linePath + '" fill="none" stroke="var(--viz-blue-500)" stroke-width="2.25" stroke-linejoin="round" stroke-linecap="round"/>' +
      dots + endLabel + labels + '</svg>';
  }

  function renderDonut(segments, centerValue, centerLabel) {
    var total = segments.reduce(function (s, x) { return s + x.value; }, 0);
    if (total === 0) return '<div class="chart-empty">No data for the current filters.</div>';
    var cx = 110, cy = 100, rOuter = 72, rInner = 48;
    var startAngle = -Math.PI / 2;
    var body = '', callouts = '';
    segments.forEach(function (s) {
      if (s.value <= 0) return;
      var frac = s.value / total;
      var endAngle = startAngle + frac * Math.PI * 2;
      var p1 = [cx + rOuter * Math.cos(startAngle), cy + rOuter * Math.sin(startAngle)];
      var p2 = [cx + rOuter * Math.cos(endAngle), cy + rOuter * Math.sin(endAngle)];
      var p3 = [cx + rInner * Math.cos(endAngle), cy + rInner * Math.sin(endAngle)];
      var p4 = [cx + rInner * Math.cos(startAngle), cy + rInner * Math.sin(startAngle)];
      var largeArc = (endAngle - startAngle) > Math.PI ? 1 : 0;
      var d = 'M' + p1[0] + ',' + p1[1] + ' A' + rOuter + ',' + rOuter + ' 0 ' + largeArc + ' 1 ' + p2[0] + ',' + p2[1] +
        ' L' + p3[0] + ',' + p3[1] + ' A' + rInner + ',' + rInner + ' 0 ' + largeArc + ' 0 ' + p4[0] + ',' + p4[1] + ' Z';
      body += '<path d="' + d + '" fill="' + s.color + '" stroke="#ffffff" stroke-width="3"/>';
      var midAngle = (startAngle + endAngle) / 2, pct = Math.round(frac * 100);
      if (pct >= 4) {
        /* leader line + arrowhead pointing away from the ring, percentage sits past the tip */
        var ax = Math.cos(midAngle), ay = Math.sin(midAngle);
        var lx1 = cx + (rOuter + 3) * ax, ly1 = cy + (rOuter + 3) * ay;
        var lx2 = cx + (rOuter + 17) * ax, ly2 = cy + (rOuter + 17) * ay;
        var tipX = lx2 + 5 * ax, tipY = ly2 + 5 * ay;
        var px = -ay, py = ax;
        var b1x = lx2 - 3 * px, b1y = ly2 - 3 * py;
        var b2x = lx2 + 3 * px, b2y = ly2 + 3 * py;
        var tx = cx + (rOuter + 23) * ax, ty = cy + (rOuter + 23) * ay;
        var anchor = ax > 0.15 ? 'start' : ax < -0.15 ? 'end' : 'middle';
        callouts += '<line x1="' + lx1 + '" y1="' + ly1 + '" x2="' + lx2 + '" y2="' + ly2 + '" stroke="' + s.color + '" stroke-width="1.5"/>' +
          '<polygon points="' + tipX + ',' + tipY + ' ' + b1x + ',' + b1y + ' ' + b2x + ',' + b2y + '" fill="' + s.color + '"/>' +
          '<text x="' + tx + '" y="' + (ty + 4) + '" font-size="12" font-weight="700" fill="var(--color-text-primary)" text-anchor="' + anchor + '">' + pct + '%</text>';
      }
      startAngle = endAngle;
    });
    var center = '<text x="' + cx + '" y="' + (cy - 3) + '" font-size="24" font-weight="700" fill="var(--color-text-primary)" text-anchor="middle">' + centerValue + '</text>' +
      '<text x="' + cx + '" y="' + (cy + 16) + '" font-size="11" fill="var(--viz-ink-muted)" text-anchor="middle">' + centerLabel + '</text>';
    return '<svg viewBox="0 0 220 200" width="100%" height="200" style="overflow:visible">' + body + callouts + center + '</svg>';
  }

  function heatmapHtml(filtered) {
    var competencies = ALL_COMPETENCIES.filter(function (c) { return filters.group ? GROUP_COMPETENCIES[filters.group].indexOf(c) > -1 : true; });
    var roles = filters.role ? [filters.role] : ROLES;
    var html = '<div class="heatmap-grid" style="grid-template-columns:150px repeat(' + roles.length + ', 1fr)">';
    html += '<div></div>' + roles.map(function (r) { return '<div class="heatmap-col-label">' + r + '</div>'; }).join('');
    competencies.forEach(function (c) {
      html += '<div class="heatmap-row-label">' + c + '</div>';
      roles.forEach(function (r) {
        var rows = filtered.filter(function (f) { return f.competency === c && f.role === r; });
        if (!rows.length) { html += '<div class="heatmap-cell heatmap-empty-cell">—</div>'; return; }
        var score = avg(rows.map(function (x) { return x.weight; }));
        var band = bandOf(score, BENCHMARK[c]);
        html += '<div class="heatmap-cell" style="background:' + BAND_BG[band] + ';color:' + BAND_TEXT[band] + '" title="' + c + ' · ' + r + ': ' + score.toFixed(1) + ' (n=' + rows.length + ')">' + score.toFixed(1) + '</div>';
      });
    });
    return html + '</div>';
  }

  function statusLegendHtml() {
    return ['good', 'warning', 'critical'].map(function (b) {
      return '<span class="status-legend-item"><span class="status-dot" style="background:' + BAND_COLOR[b] + '"></span>' + BAND_LABEL[b] + '</span>';
    }).join('');
  }

  /* ============================================================
     KPI tiles (5, compact)
  ============================================================ */
  function renderKpis(filtered) {
    var overallScore = avg(filtered.map(function (f) { return f.weight; }));
    // record-level benchmark so numerator and denominator average over the same rows
    var overallBenchmark = avg(filtered.map(function (f) { return f.benchmark; })) || 0;
    var attainment = overallBenchmark ? Math.round((overallScore / overallBenchmark) * 100) : 0;
    var attainBand = attainment >= 85 ? 'good' : attainment >= 70 ? 'warning' : 'critical';
    var trendByMonth = MONTH_LABELS.map(function (l, idx) { return avg(filtered.filter(function (f) { return f.month === idx; }).map(function (f) { return f.weight; })); });
    var scoreDeltaPct = trendByMonth[0] ? Math.round(((trendByMonth[trendByMonth.length - 1] - trendByMonth[0]) / trendByMonth[0]) * 100) : 0;

    var userBandCounts = { good: 0, warning: 0, critical: 0 };
    var assesseeUids = uniqueVals(filtered, 'assesseeUid');
    assesseeUids.forEach(function (uid) {
      var rows = filtered.filter(function (f) { return f.assesseeUid === uid; });
      userBandCounts[bandOf(avg(rows.map(function (r) { return r.weight; })), avg(rows.map(function (r) { return r.benchmark; })))]++;
    });
    var totalUsers = assesseeUids.length;

    var byCompetency = uniqueVals(filtered, 'competency').map(function (c) {
      var rows = filtered.filter(function (f) { return f.competency === c; });
      return { label: c, score: avg(rows.map(function (r) { return r.weight; })), benchmark: BENCHMARK[c] };
    });
    var worst = byCompetency.slice().sort(function (a, b) { return (a.score - a.benchmark) - (b.score - b.benchmark); })[0];

    var html = '';

    /* 1 — average score + trend + sparkline */
    html += '<div class="kpi-tile" style="--kpi-accent:var(--viz-blue-500)">' +
      '<div class="kpi-tile-top"><div class="kpi-icon"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg></div>' +
      '<span class="kpi-trend ' + (scoreDeltaPct >= 0 ? 'is-good' : 'is-bad') + '">' + (scoreDeltaPct >= 0 ? '▲' : '▼') + ' ' + Math.abs(scoreDeltaPct) + '%</span></div>' +
      '<span class="kpi-label">Average Score</span>' +
      '<span class="kpi-value">' + overallScore.toFixed(1) + ' <span class="sub">/ 3.0</span></span>' +
      '<div class="kpi-foot">' + sparkline(trendByMonth, 110, 20) + '</div></div>';

    /* 2 — NEW: benchmark attainment with meter */
    html += '<div class="kpi-tile" style="--kpi-accent:' + BAND_COLOR[attainBand] + '">' +
      '<div class="kpi-tile-top"><div class="kpi-icon" style="--kpi-icon-bg:' + BAND_BG[attainBand] + ';--kpi-icon-fg:' + BAND_TEXT[attainBand] + '"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="2"/></svg></div></div>' +
      '<span class="kpi-label" title="Average score as a percentage of benchmark">Attainment</span>' +
      '<span class="kpi-value">' + attainment + '<span class="sub">%</span></span>' +
      '<div class="kpi-foot"><div class="kpi-mini-bar-track">' +
      '<span class="kpi-mini-bar-seg" style="width:' + Math.min(100, attainment) + '%;background:' + BAND_COLOR[attainBand] + '"></span></div>' +
      '<div class="kpi-mini-legend"><span>target ' + overallBenchmark.toFixed(1) + ' · actual ' + overallScore.toFixed(1) + '</span></div></div></div>';

    /* 3 — at-risk assessees + composition */
    html += '<div class="kpi-tile" style="--kpi-accent:var(--viz-critical)">' +
      '<div class="kpi-tile-top"><div class="kpi-icon" style="--kpi-icon-bg:var(--viz-critical-bg);--kpi-icon-fg:var(--viz-critical-text)"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0Z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg></div></div>' +
      '<span class="kpi-label" title="Assessees scoring below 70% of benchmark">At Risk</span>' +
      '<span class="kpi-value">' + userBandCounts.critical + ' <span class="sub">of ' + totalUsers + '</span></span>' +
      '<div class="kpi-foot"><div class="kpi-mini-bar-track">' +
      ['good', 'warning', 'critical'].map(function (b) {
        var pct = totalUsers ? (userBandCounts[b] / totalUsers) * 100 : 0;
        return pct > 0 ? '<span class="kpi-mini-bar-seg" style="width:' + pct + '%;background:' + BAND_COLOR[b] + '"></span>' : '';
      }).join('') + '</div>' +
      '<div class="kpi-mini-legend"><span>' + userBandCounts.good + ' ok</span><span>' + userBandCounts.warning + ' watch</span><span>' + userBandCounts.critical + ' risk</span></div></div></div>';

    /* 4 — biggest skill gap */
    html += '<div class="kpi-tile" style="--kpi-accent:var(--viz-warning)">' +
      '<div class="kpi-tile-top"><div class="kpi-icon" style="--kpi-icon-bg:var(--viz-warning-bg);--kpi-icon-fg:var(--viz-warning-text)"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3Z"/><line x1="12" y1="9" x2="12" y2="13"/></svg></div></div>' +
      '<span class="kpi-label">Biggest Skill Gap</span>' +
      (worst
        ? '<span class="kpi-value">' + (worst.score - worst.benchmark).toFixed(1) + '</span>' +
          '<div class="kpi-foot"><div class="kpi-gap-name" title="' + worst.label + '">' + worst.label + '</div>' +
          '<div class="kpi-note">' + worst.score.toFixed(1) + ' vs target ' + worst.benchmark.toFixed(1) + '</div></div>'
        : '<span class="kpi-value">—</span>') +
      '</div>';

    /* 5 — total assessments + role mix */
    html += '<div class="kpi-tile" style="--kpi-accent:var(--color-border)">' +
      '<div class="kpi-tile-top"><div class="kpi-icon"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="m9 12 2 2 4-4"/></svg></div></div>' +
      '<span class="kpi-label" title="Total assessment records in scope">Assessments</span>' +
      '<span class="kpi-value">' + filtered.length + '</span>' +
      '<div class="kpi-foot"><div class="kpi-mini-bar-track">' +
      ROLES.map(function (r, i) {
        var count = filtered.filter(function (f) { return f.role === r; }).length;
        var pct = filtered.length ? (count / filtered.length) * 100 : 0;
        var shades = ['var(--viz-blue-700)', 'var(--viz-blue-500)', 'var(--viz-blue-300)', 'var(--viz-blue-100)'];
        return pct > 0 ? '<span class="kpi-mini-bar-seg" style="width:' + pct + '%;background:' + shades[i % shades.length] + '"></span>' : '';
      }).join('') + '</div>' +
      '<div class="kpi-mini-legend"><span>' + totalUsers + ' assessees</span><span>' + uniqueVals(filtered, 'surveyId').length + ' surveys</span></div></div></div>';

    document.getElementById('kpi-grid').innerHTML = html;
  }

  /* ============================================================
     Tabs
  ============================================================ */
  var TABS = [
    { key: 'overview', label: 'Overview' },
    { key: 'competency', label: 'Competency Analysis' },
    { key: 'role', label: 'Role Analysis' },
    { key: 'assessee', label: 'Assessee Report' }
  ];
  var activeTab = 'overview';

  function renderTabsUI() {
    document.getElementById('report-tabs').innerHTML = TABS.map(function (t) {
      return '<button type="button" class="report-tab' + (t.key === activeTab ? ' is-active' : '') + '" data-tab="' + t.key + '">' + t.label + '</button>';
    }).join('');
  }
  document.getElementById('report-tabs').addEventListener('click', function (e) {
    var btn = e.target.closest('[data-tab]');
    if (!btn) return;
    activeTab = btn.getAttribute('data-tab');
    renderTabsUI();
    renderTabContent(applyFilters());
  });

  /* ---- tab: overview ---- */
  function tabOverview(filtered) {
    var userBandCounts = { good: 0, warning: 0, critical: 0 };
    var uids = uniqueVals(filtered, 'assesseeUid');
    uids.forEach(function (uid) {
      var rows = filtered.filter(function (f) { return f.assesseeUid === uid; });
      userBandCounts[bandOf(avg(rows.map(function (r) { return r.weight; })), avg(rows.map(function (r) { return r.benchmark; })))]++;
    });

    return '<div class="chart-card">' +
      '<div class="chart-header"><div><span class="chart-title">Competency × Role Performance</span>' +
      '<div class="chart-subtitle">Average weighted score for every competency, broken down by role</div></div>' +
      '<div class="status-legend">' + statusLegendHtml() + '</div></div>' +
      '<div class="heatmap-scroll">' + heatmapHtml(filtered) + '</div></div>' +

      '<div class="row-2col">' +
      '<div class="chart-card"><div class="chart-header"><div><span class="chart-title">Assessee Distribution by Competency</span>' +
      '<div class="chart-subtitle">How many assessees are green, amber or red on each competency</div></div>' +
      '<div class="status-legend">' + statusLegendHtml() + '</div></div>' +
      '<div class="chart-body band-dist-scroll">' + renderBandDistribution(assesseeBandDistributionByCompetency(filtered), 'people') + '</div></div>' +
      '<div class="chart-card"><div class="chart-header"><div><span class="chart-title">Overall User Performance</span>' +
      '<div class="chart-subtitle">' + uids.length + ' assessees, by benchmark band</div></div></div>' +
      '<div class="chart-body">' + renderDonut([
        { value: userBandCounts.good, color: 'var(--viz-good)' },
        { value: userBandCounts.warning, color: 'var(--viz-warning)' },
        { value: userBandCounts.critical, color: 'var(--viz-critical)' }
      ], uids.length, 'Assessees') + '</div>' +
      '<div class="chart-legend">' + ['good', 'warning', 'critical'].map(function (b) {
        return '<span class="chart-legend-item"><span class="chart-legend-swatch" style="background:' + BAND_COLOR[b] + '"></span>' + userBandCounts[b] + ' ' + b + '</span>';
      }).join('') + '</div></div></div>';
  }

  /* ---- tab: competency analysis ---- */
  function tabCompetency(filtered) {
    var byCompetency = uniqueVals(filtered, 'competency').map(function (c) {
      var rows = filtered.filter(function (f) { return f.competency === c; });
      return { label: c, score: avg(rows.map(function (r) { return r.weight; })), benchmark: BENCHMARK[c] };
    });
    var levelRows = uniqueVals(filtered, 'competency').map(function (c) {
      var rows = filtered.filter(function (f) { return f.competency === c; });
      var counts = { Foundation: 0, Proficient: 0, Advance: 0 };
      rows.forEach(function (r) { counts[r.level]++; });
      return { label: c, counts: counts };
    });

    return '<div class="chart-card">' +
      '<div class="chart-header"><div><span class="chart-title">Score vs Benchmark by Competency</span>' +
      '<div class="chart-subtitle">Weighted average (0–3) · gap pill shows distance from target</div></div>' +
      '<div class="chart-legend">' +
      '<span class="chart-legend-item"><span class="chart-legend-swatch" style="background:var(--viz-blue-500)"></span>Score</span>' +
      '<span class="chart-legend-item"><span class="chart-legend-swatch" style="background:var(--viz-benchmark)"></span>Benchmark</span></div></div>' +
      '<div class="chart-body">' + renderPairBars(byCompetency) + '</div></div>' +

      '<div class="chart-card">' +
      '<div class="chart-header"><div><span class="chart-title">Competency Group Analysis</span>' +
      '<div class="chart-subtitle">How many competencies sit in each band, per group</div></div>' +
      '<div class="status-legend">' + statusLegendHtml() + '</div></div>' +
      '<div class="chart-body band-dist-scroll">' + renderBandDistribution(groupBandDistribution(filtered), 'comp.') + '</div></div>' +

      '<div class="chart-card">' +
      '<div class="chart-header"><div><span class="chart-title">Proficiency Level Mix</span>' +
      '<div class="chart-subtitle">How many assessees landed at each level, per competency</div></div>' +
      '<div class="chart-legend">' +
      '<span class="chart-legend-item"><span class="chart-legend-swatch" style="background:var(--viz-blue-100)"></span>Foundation (1)</span>' +
      '<span class="chart-legend-item"><span class="chart-legend-swatch" style="background:var(--viz-blue-300)"></span>Proficient (2)</span>' +
      '<span class="chart-legend-item"><span class="chart-legend-swatch" style="background:var(--viz-blue-700)"></span>Advance (3)</span></div></div>' +
      '<div class="chart-body">' + renderStackedLevels(levelRows) + '</div></div>' +

      '<div class="chart-card">' +
      '<div class="chart-header"><div><span class="chart-title">Score Trend</span>' +
      '<div class="chart-subtitle">Average weighted score by month, vs benchmark reference</div></div></div>' +
      '<div class="chart-body">' + renderAreaTrend(
        MONTH_LABELS.map(function (label, idx) { return { label: label, value: avg(filtered.filter(function (f) { return f.month === idx; }).map(function (f) { return f.weight; })) }; }),
        avg(filtered.map(function (f) { return f.benchmark; })) || 2
      ) + '</div></div>';
  }

  /* ---- tab: role analysis ---- */
  function tabRole(filtered) {
    var roleRows = uniqueVals(filtered, 'role').map(function (r) {
      var rows = filtered.filter(function (f) { return f.role === r; });
      var score = avg(rows.map(function (x) { return x.weight; }));
      var benchmark = avg(rows.map(function (x) { return x.benchmark; }));
      return { label: r, score: score, band: bandOf(score, benchmark) };
    });
    var groupRows = uniqueVals(filtered, 'group').map(function (g) {
      var rows = filtered.filter(function (f) { return f.group === g; });
      return { label: g, score: avg(rows.map(function (r) { return r.weight; })), benchmark: avg(rows.map(function (r) { return r.benchmark; })) };
    });
    var roleLevelRows = uniqueVals(filtered, 'role').map(function (r) {
      var rows = filtered.filter(function (f) { return f.role === r; });
      var counts = { Foundation: 0, Proficient: 0, Advance: 0 };
      rows.forEach(function (x) { counts[x.level]++; });
      return { label: r, counts: counts };
    });

    return '<div class="chart-card">' +
      '<div class="chart-header"><div><span class="chart-title">Role-wise Average Score</span>' +
      '<div class="chart-subtitle">Colored by benchmark band</div></div>' +
      '<div class="status-legend">' + statusLegendHtml() + '</div></div>' +
      '<div class="chart-body">' + renderBandBars(roleRows) + '</div></div>' +

      '<div class="chart-card">' +
      '<div class="chart-header"><div><span class="chart-title">Score vs Benchmark by Competency Group</span>' +
      '<div class="chart-subtitle">Which capability areas are ahead of or behind target</div></div>' +
      '<div class="chart-legend">' +
      '<span class="chart-legend-item"><span class="chart-legend-swatch" style="background:var(--viz-blue-500)"></span>Score</span>' +
      '<span class="chart-legend-item"><span class="chart-legend-swatch" style="background:var(--viz-benchmark)"></span>Benchmark</span></div></div>' +
      '<div class="chart-body">' + renderPairBars(groupRows) + '</div></div>' +

      '<div class="chart-card">' +
      '<div class="chart-header"><div><span class="chart-title">Proficiency Level Mix by Role</span>' +
      '<div class="chart-subtitle">Distribution of awarded levels within each role</div></div>' +
      '<div class="chart-legend">' +
      '<span class="chart-legend-item"><span class="chart-legend-swatch" style="background:var(--viz-blue-100)"></span>Foundation</span>' +
      '<span class="chart-legend-item"><span class="chart-legend-swatch" style="background:var(--viz-blue-300)"></span>Proficient</span>' +
      '<span class="chart-legend-item"><span class="chart-legend-swatch" style="background:var(--viz-blue-700)"></span>Advance</span></div></div>' +
      '<div class="chart-body">' + renderStackedLevels(roleLevelRows) + '</div></div>';
  }

  /* ---- tab: assessee report ---- */
  function tabAssessee(filtered) {
    var rows = uniqueVals(filtered, 'assesseeUid').map(function (uid) {
      var recs = filtered.filter(function (f) { return f.assesseeUid === uid; });
      var score = avg(recs.map(function (r) { return r.weight; }));
      var benchmark = avg(recs.map(function (r) { return r.benchmark; }));
      return { uid: uid, name: recs[0].assesseeName, role: recs[0].role, score: score, benchmark: benchmark, band: bandOf(score, benchmark), count: recs.length };
    }).sort(function (a, b) { return b.score - a.score; });

    var body = rows.map(function (r) {
      var pct = Math.round((r.score / 3) * 100);
      var statusText = r.band === 'good' ? 'On track' : r.band === 'warning' ? 'Watch' : 'At risk';
      return '<tr><td>' + r.uid + '</td><td>' + r.name + '</td><td>' + r.role + '</td>' +
        '<td><span class="mini-bar-track"><span class="mini-bar-fill" style="width:' + pct + '%;background:' + BAND_COLOR[r.band] + '"></span></span>' + r.score.toFixed(1) + ' / 3.0</td>' +
        '<td>' + r.benchmark.toFixed(1) + '</td>' +
        '<td><span class="band-pill" style="color:' + BAND_TEXT[r.band] + '"><span class="status-dot" style="background:' + BAND_COLOR[r.band] + '"></span>' + statusText + '</span></td>' +
        '<td>' + r.count + '</td></tr>';
    }).join('');

    return '<div class="chart-card">' +
      '<div class="chart-header"><div><span class="chart-title">Assessee Report</span>' +
      '<div class="chart-subtitle">' + rows.length + ' assessees, ranked by weighted score</div></div>' +
      '<div class="status-legend">' + statusLegendHtml() + '</div></div>' +
      '<div class="report-table-wrap"><table class="report-table"><thead><tr>' +
      '<th>UID</th><th>Name</th><th>Role</th><th>Score</th><th>Benchmark</th><th>Status</th><th>Records</th>' +
      '</tr></thead><tbody>' + (body || '<tr><td colspan="7" style="text-align:center;color:var(--color-text-tertiary)">No data for the current filters.</td></tr>') + '</tbody></table></div></div>';
  }

  function renderTabContent(filtered) {
    var el = document.getElementById('tab-content');
    if (activeTab === 'overview') el.innerHTML = tabOverview(filtered);
    else if (activeTab === 'competency') el.innerHTML = tabCompetency(filtered);
    else if (activeTab === 'role') el.innerHTML = tabRole(filtered);
    else el.innerHTML = tabAssessee(filtered);
  }

  /* ============================================================
     Master render
  ============================================================ */
  function renderAll() {
    var filtered = applyFilters();
    document.getElementById('filter-result-count').textContent = filtered.length + ' of ' + FACTS.length + ' records';
    var count = activeFilterCount();
    var badge = document.getElementById('active-count');
    badge.hidden = count === 0;
    badge.textContent = count;
    renderKpis(filtered);
    renderTabContent(filtered);
  }

  renderTabsUI();
  renderAll();
</script>

</body>
</html>
